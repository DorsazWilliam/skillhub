# SkillHub against the client's own Postgres and S3-compatible bucket (set DATABASE_URL and the S3_* variables in .env).
#   docker compose -f external.yml up -d
services:
  skillhub:
    image: ${SKILLHUB_IMAGE:-ghcr.io/dorsazwilliam/skillhub:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE: s3
    ports:
      - "${SKILLHUB_PORT:-8080}:8080"
