# SkillHub with its own Postgres and an S3-compatible store (SeaweedFS), all on this machine.
#   cp deploy/compose/.env.example deploy/compose/.env   (fill it in, set POSTGRES_PASSWORD and S3_SECRET)
#   docker compose -f deploy/compose/bundled.yml up -d
services:
  skillhub:
    image: ${SKILLHUB_IMAGE:-ghcr.io/dorsazwilliam/skillhub:latest}
    build: ../..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://skillhub:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/skillhub
      STORAGE: s3
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: skillhub
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: skillhub
      S3_SECRET_ACCESS_KEY: ${S3_SECRET:?set S3_SECRET}
      S3_FORCE_PATH_STYLE: "true"
      S3_CREATE_BUCKET: "true"
    ports:
      - "${SKILLHUB_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_started }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: skillhub
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillhub -d skillhub"]
      interval: 5s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.55
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0
    configs:
      - source: s3-identities
        target: /etc/seaweedfs/s3.json
    volumes:
      - s3-data:/data

configs:
  s3-identities:
    content: |
      {"identities":[{"name":"skillhub","credentials":[{"accessKey":"skillhub","secretKey":"${S3_SECRET:?set S3_SECRET}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

volumes:
  pg-data:
  s3-data:
