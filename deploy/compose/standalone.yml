# SkillHub alone: SQLite and uploads on one volume. Nothing else to run.
#   cp .env.example .env   (fill it in)
#   docker compose -f standalone.yml up -d
services:
  skillhub:
    image: ${SKILLHUB_IMAGE:-ghcr.io/dorsazwilliam/skillhub:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:/data/skillhub.db
      STORAGE: disk
      STORAGE_DIR: /data/files
    ports:
      - "${SKILLHUB_PORT:-8080}:8080"
    volumes:
      - skillhub-data:/data

volumes:
  skillhub-data:
