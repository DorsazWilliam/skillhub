{{- if not .Values.existingSecret }}
{{- if not .Values.secrets.sessionSecret }}{{ fail "secrets.sessionSecret is required (openssl rand -hex 32), or set existingSecret" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skillhub.secretName" . }}
  labels: {{- include "skillhub.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  ENTRA_CLIENT_SECRET: {{ .Values.secrets.entraClientSecret | quote }}
  {{- if eq .Values.database.type "postgres" }}
  {{- if .Values.bundled.postgres.enabled }}
  {{- if not .Values.bundled.postgres.password }}{{ fail "bundled.postgres.password is required" }}{{ end }}
  DATABASE_URL: {{ printf "postgres://skillhub:%s@%s-postgres:5432/skillhub" (.Values.bundled.postgres.password | urlquery) .Release.Name | quote }}
  {{- else }}
  {{- if not .Values.database.url }}{{ fail "database.url is required for database.type=postgres (or set existingSecret with DATABASE_URL)" }}{{ end }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.storage.type "s3" }}
  {{- if .Values.bundled.s3.enabled }}
  {{- if not .Values.bundled.s3.secretKey }}{{ fail "bundled.s3.secretKey is required" }}{{ end }}
  S3_ACCESS_KEY_ID: skillhub
  S3_SECRET_ACCESS_KEY: {{ .Values.bundled.s3.secretKey | quote }}
  {{- else }}
  S3_ACCESS_KEY_ID: {{ .Values.storage.s3.accessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.storage.s3.secretAccessKey | quote }}
  {{- end }}
  {{- end }}
{{- end }}
