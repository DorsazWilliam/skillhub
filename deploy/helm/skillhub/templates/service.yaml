apiVersion: v1
kind: Service
metadata:
  name: {{ include "skillhub.name" . }}
  labels: {{- include "skillhub.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "skillhub.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
---
{{- if and (include "skillhub.needsVolume" .) (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels: {{- include "skillhub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.persistence.size }} } }
{{- end }}
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "skillhub.name" . }}
  labels: {{- include "skillhub.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ include "skillhub.host" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "skillhub.name" . }}, port: { name: http } } }
{{- end }}
