{{- /* Bundled Postgres and S3 store (SeaweedFS), for clusters that have neither. One replica each, on their own volume. */ -}}
{{- if .Values.bundled.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "skillhub.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: skillhub-postgres, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: skillhub-postgres, app.kubernetes.io/instance: {{ .Release.Name }} } }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.bundled.postgres.image }}
          env:
            - { name: POSTGRES_USER, value: skillhub }
            - { name: POSTGRES_DB, value: skillhub }
            - { name: POSTGRES_PASSWORD, value: {{ .Values.bundled.postgres.password | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: pg, containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "skillhub", "-d", "skillhub"] }, periodSeconds: 5 }
          volumeMounts: [{ name: pg, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: pg }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.bundled.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.bundled.postgres.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "skillhub.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: skillhub-postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
---
{{- end }}
{{- if .Values.bundled.s3.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-s3-identities
  labels: {{- include "skillhub.labels" . | nindent 4 }}
stringData:
  s3.json: |
    {"identities":[{"name":"skillhub","credentials":[{"accessKey":"skillhub","secretKey":{{ .Values.bundled.s3.secretKey | quote }}}],"actions":["Admin","Read","Write","List","Tagging"]}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-s3
  labels: {{- include "skillhub.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-s3
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: skillhub-s3, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: skillhub-s3, app.kubernetes.io/instance: {{ .Release.Name }} } }
    spec:
      containers:
        - name: seaweedfs
          image: {{ .Values.bundled.s3.image }}
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=0"]
          ports: [{ name: s3, containerPort: 8333 }]
          readinessProbe: { tcpSocket: { port: s3 }, periodSeconds: 5 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: identities, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - name: identities
          secret: { secretName: {{ .Release.Name }}-s3-identities }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.bundled.s3.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.bundled.s3.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-s3
  labels: {{- include "skillhub.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: skillhub-s3, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: s3, port: 8333, targetPort: s3 }]
{{- end }}
