<title>SkillHub Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: icon rail | lazy tree | reading column | details drawer. Quiet neutrals with a faint blue bias, one accent. */
:root{
  --bg:#f6f7f9;--panel:#ffffff;--sunken:#f1f3f6;--hover:#eceff4;--border:#e3e6eb;--border-2:#d2d7df;
  --fg:#0f172a;--fg-2:#334155;--muted:#64748b;--faint:#97a1b2;
  --accent:#2563eb;--accent-2:#1d4ed8;--accent-soft:#e8f0fe;--accent-fg:#ffffff;
  --ok:#15803d;--ok-soft:#e6f5eb;--warn:#b45309;--warn-dot:#f59e0b;--warn-soft:#fdf2e0;--danger:#dc2626;--danger-soft:#fdeceb;
  --add:#e7f6eb;--add-fg:#166534;--del:#fdeceb;--del-fg:#991b1b;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.08);
  --shadow-lg:0 2px 6px rgba(15,23,42,.06),0 24px 56px rgba(15,23,42,.18);
  --scrim:rgba(15,23,42,.28);--av-bg:91%;--av-fg:32%;--tip-bg:#0f172a;--tip-fg:#f8fafc;--mark:#fde68a;--mark-fg:#0f172a;
  --font:'Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0c10;--panel:#0f1217;--sunken:#151920;--hover:#1a1f28;--border:#20262f;--border-2:#2d3440;
  --fg:#e6e9ef;--fg-2:#c3c9d3;--muted:#8b94a3;--faint:#5c6575;
  --accent:#4b8af5;--accent-2:#6d9ff7;--accent-soft:rgba(75,138,245,.15);--accent-fg:#ffffff;
  --ok:#43b56d;--ok-soft:rgba(67,181,109,.14);--warn:#e5a143;--warn-dot:#e5a143;--warn-soft:rgba(229,161,67,.14);--danger:#f2615b;--danger-soft:rgba(242,97,91,.14);
  --add:rgba(67,181,109,.13);--add-fg:#7fd9a0;--del:rgba(242,97,91,.13);--del-fg:#f6a19c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 56px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.55);--av-bg:24%;--av-fg:80%;--tip-bg:#e6e9ef;--tip-fg:#0a0c10;--mark:rgba(229,161,67,.35);--mark-fg:#fff;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0c10;--panel:#0f1217;--sunken:#151920;--hover:#1a1f28;--border:#20262f;--border-2:#2d3440;
  --fg:#e6e9ef;--fg-2:#c3c9d3;--muted:#8b94a3;--faint:#5c6575;
  --accent:#4b8af5;--accent-2:#6d9ff7;--accent-soft:rgba(75,138,245,.15);--accent-fg:#ffffff;
  --ok:#43b56d;--ok-soft:rgba(67,181,109,.14);--warn:#e5a143;--warn-dot:#e5a143;--warn-soft:rgba(229,161,67,.14);--danger:#f2615b;--danger-soft:rgba(242,97,91,.14);
  --add:rgba(67,181,109,.13);--add-fg:#7fd9a0;--del:rgba(242,97,91,.13);--del-fg:#f6a19c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 56px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.55);--av-bg:24%;--av-fg:80%;--tip-bg:#e6e9ef;--tip-fg:#0a0c10;--mark:rgba(229,161,67,.35);--mark-fg:#fff;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.i{flex:none;display:block}
#root{height:100%}
code,kbd,.mono{font-family:var(--mono)}
kbd{font-size:11px;padding:1px 5px;border:1px solid var(--border-2);border-bottom-width:2px;border-radius:5px;color:var(--muted);background:var(--panel)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* controls */
.ib{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;color:var(--muted);transition:background .12s,color .12s}
.ib:hover{background:var(--hover);color:var(--fg)}
.ib.on{color:var(--accent);background:var(--accent-soft)}
.ib.sm{width:28px;height:28px}.ib.xs{width:24px;height:24px;border-radius:6px}
.ib:disabled{opacity:.35;pointer-events:none}
.ib.armed,.btn.armed{background:var(--danger)!important;color:#fff!important;width:auto;padding:0 10px;gap:6px;display:inline-flex;align-items:center;font-size:12.5px;font-weight:500}
.btn{height:32px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border-radius:8px;border:1px solid var(--border-2);background:var(--panel);font-weight:500;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s,opacity .12s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.input,.select{height:34px;border:1px solid var(--border-2);background:var(--panel);border-radius:8px;padding:0 10px;min-width:0;transition:border-color .12s,box-shadow .12s}
.input:focus,.select:focus,textarea.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
.select{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 10px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.select.bare{border-color:transparent;background-color:transparent;height:30px;font-size:13px;color:var(--fg-2)}
.select.bare:hover{background-color:var(--hover)}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:var(--sunken);color:var(--fg-2);font-size:12px;font-weight:500;white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.switch{position:relative;width:34px;height:20px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--border-2);transition:background .15s}
.switch span::after{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(14px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.cb{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
.av{--s:24px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;flex:none;font-size:calc(var(--s)*.4);font-weight:600;letter-spacing:.02em;background:hsl(var(--h) 55% var(--av-bg));color:hsl(var(--h) 45% var(--av-fg))}
.av.sq{border-radius:calc(var(--s)*.28)}
.av.ev{background:var(--accent-soft);color:var(--accent)}
.av.cl{background:var(--sunken);color:var(--fg-2);border:1px solid var(--border)}
.stack{display:inline-flex}.stack .av{box-shadow:0 0 0 2px var(--panel)}.stack .av+.av{margin-left:-6px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.row-flex{display:flex;align-items:center;gap:8px;min-width:0}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sep{width:1px;height:18px;background:var(--border);margin:0 4px;flex:none}

/* shell */
.shell{display:grid;height:100%;grid-template-rows:52px minmax(0,1fr);grid-template-columns:56px 272px minmax(0,1fr) 0;grid-template-areas:"top top top top" "rail tree main drawer";transition:grid-template-columns .2s ease}
.shell.with-drawer{grid-template-columns:56px 272px minmax(0,1fr) 352px}
.shell.page-mode{grid-template-columns:56px 0 minmax(0,1fr) 0}
.shell:not(.with-drawer) .drawer,.shell.page-mode .drawer,.shell.page-mode .tree{display:none}
.top{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;border-bottom:1px solid var(--border);background:var(--panel);min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;font-size:14.5px;flex:none;width:300px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.brand .org{color:var(--faint);font-weight:500}
.search{position:relative;flex:1;max-width:560px;min-width:0}
.search .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{width:100%;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--sunken);padding:0 34px 0 34px;transition:background .12s,border-color .12s,box-shadow .12s}
.search input:focus{outline:none;background:var(--panel);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:4px}
.mbtn{display:none}
.rail{grid-area:rail;border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
.rail .ib{width:38px;height:38px;border-radius:10px}
.rail .sp{flex:1}
.tree{grid-area:tree;border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tree-head{display:flex;align-items:center;gap:2px;padding:12px 10px 6px 16px;flex:none}
.tree-head .lbl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);flex:1}
.tree-body{flex:1;overflow:auto;padding:2px 8px 12px}
.tree-foot{border-top:1px solid var(--border);padding:6px 8px;display:flex;gap:2px}
.row{--d:0;display:flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 calc(6px + var(--d)*16px);border-radius:7px;cursor:pointer;user-select:none;color:var(--fg-2);position:relative}
.row:hover{background:var(--hover)}
.row.sel{background:var(--accent-soft);color:var(--fg)}
.row.sel .ri{color:var(--accent)}
.row .tw{width:16px;height:16px;display:grid;place-items:center;color:var(--faint);transition:transform .15s;flex:none;border-radius:4px}
.row .tw:hover{color:var(--fg)}
.row .tw.open{transform:rotate(90deg)}
.row .ri{color:var(--faint)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.row .lk{color:var(--faint);display:grid}
.row .more{opacity:0}
.row:hover .more,.row.sel .more{opacity:1}
.row.drop{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.row.dragging{opacity:.4}
.row input{flex:1;min-width:0;height:24px;border:1px solid var(--accent);border-radius:5px;padding:0 6px;background:var(--panel);font-size:13px;outline:none}
.mk{width:16px;height:16px;display:grid;place-items:center;flex:none}
.mk::before{content:"";width:7px;height:7px;border-radius:50%}
.mk.dot::before{background:var(--accent)}
.mk.amber::before{background:var(--warn-dot)}
.mk.ring::before{border:1.5px solid var(--faint);width:5px;height:5px}
.mk.ok::before{display:none}.mk.ok{color:var(--ok)}
.empty-row{padding:4px 0 4px calc(30px + var(--d)*16px);font-size:12px;color:var(--faint);height:26px;display:flex;align-items:center}
.main{grid-area:main;overflow:auto;min-width:0;background:var(--panel);position:relative}
.drawer{grid-area:drawer;border-left:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.dtabs{display:flex;align-items:center;gap:2px;padding:10px 10px 10px 12px;border-bottom:1px solid var(--border);flex:none}
.dtabs .t{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;color:var(--muted);font-size:13px;font-weight:500}
.dtabs .t:hover{background:var(--hover);color:var(--fg)}
.dtabs .t.on{background:var(--sunken);color:var(--fg)}
.dtabs .t span{display:none}.dtabs .t.on span{display:inline}
.drawer-body{flex:1;overflow:auto;padding:12px}
.scrim{display:none}

/* page */
.page{max-width:820px;margin:0 auto;padding:18px 32px 96px}
.page.wide{max-width:1120px}
.dh{display:flex;align-items:center;gap:8px;min-height:36px;position:sticky;top:0;background:var(--panel);z-index:5;padding:8px 0;margin:-8px 0 8px}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;font-size:13px;color:var(--muted);overflow:hidden}
.crumbs button{padding:3px 6px;border-radius:6px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.crumbs button:hover{background:var(--hover);color:var(--fg)}
.crumbs .cur{color:var(--fg);font-weight:500;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:6px}
.crumbs .i{color:var(--faint)}
.acts{display:flex;align-items:center;gap:2px;flex:none}
.pill-btn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 6px 0 4px;border-radius:8px;border:1px solid var(--border);margin-right:6px;color:var(--muted);transition:background .12s}
.pill-btn:hover{background:var(--hover)}
.pp{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 6px;border-radius:6px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.pp.ok{background:var(--ok-soft);color:var(--ok)}
.pp.warn{background:var(--warn-soft);color:var(--warn)}
.pp.mute{background:var(--sunken);color:var(--muted)}
.pp.dot{width:8px;height:8px;padding:0;border-radius:50%;background:var(--accent);margin:0 3px}
.banner{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--sunken);margin:4px 0 18px;font-size:13px;color:var(--fg-2)}
.banner.draft{background:var(--accent-soft)}
.banner.old{background:var(--warn-soft)}
.banner .grow{display:flex;align-items:center;gap:8px;min-width:0}
.banner b{font-weight:600}
.skill-card{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin:6px 0 22px;background:var(--bg)}
.skill-card .sk{color:var(--accent);margin-top:2px}
.skill-card code{font-size:12px;color:var(--muted)}
.skill-card p{margin:2px 0 0;color:var(--fg-2);font-size:14px;line-height:1.5}

/* markdown */
.md{font-size:15px;line-height:1.7;color:var(--fg-2);max-width:68ch;overflow-wrap:break-word}
.md>*:first-child{margin-top:0}
.md h1{font-size:30px;line-height:1.2;letter-spacing:-.02em;color:var(--fg);margin:8px 0 18px;font-weight:650;text-wrap:balance}
.md h2{font-size:19px;color:var(--fg);margin:30px 0 10px;font-weight:600;letter-spacing:-.01em}
.md h3{font-size:16px;color:var(--fg);margin:22px 0 8px;font-weight:600}
.md p{margin:0 0 14px}
.md ul,.md ol{margin:0 0 14px;padding-left:22px}
.md li{margin:3px 0}
.md li::marker{color:var(--faint)}
.md code{font-size:.86em;background:var(--sunken);border:1px solid var(--border);padding:1px 5px;border-radius:5px;color:var(--fg)}
.md pre{background:var(--sunken);border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow:auto;font-size:13px;line-height:1.55}
.md pre code{background:none;border:0;padding:0}
.md blockquote{margin:0 0 14px;padding:2px 0 2px 14px;border-left:3px solid var(--border-2);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--border);margin:24px 0}
.md a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.md a:hover{border-bottom-color:var(--accent)}
.md a.int{display:inline-flex;align-items:center;gap:3px;border:0;background:var(--accent-soft);padding:0 6px;border-radius:6px;font-size:.93em;cursor:pointer}
.md .tbl{overflow-x:auto;margin:0 0 16px;border:1px solid var(--border);border-radius:10px}
.md table{border-collapse:collapse;width:100%;font-size:13.5px}
.md th,.md td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border)}
.md th{font-weight:600;color:var(--fg);background:var(--bg)}
.md tr:last-child td{border-bottom:0}
.md figure{margin:6px 0 18px}
.md figure img{border-radius:10px;border:1px solid var(--border);display:block;max-width:100%}
.md figcaption{font-size:12px;color:var(--faint);margin-top:6px}
.md .ph{height:120px;border-radius:10px;border:1px dashed var(--border-2);display:grid;place-items:center;color:var(--faint)}
.md mark{background:var(--mark);color:var(--mark-fg);border-radius:3px;padding:0 1px}

/* editor */
.fm-card{border:1px solid var(--border);border-radius:12px;padding:12px 14px 10px;margin:4px 0 12px;background:var(--bg);transition:border-color .12s}
.fm-card:focus-within{border-color:var(--accent)}
.fm-row{display:flex;align-items:center;gap:10px;color:var(--accent)}
.fm-name{flex:1;border:0;background:none;font-family:var(--mono);font-size:14px;color:var(--fg);outline:none;padding:2px 0;min-width:0}
.fm-desc{width:100%;border:0;background:none;resize:none;outline:none;color:var(--fg-2);font-size:14px;line-height:1.5;padding:4px 0 0 26px;field-sizing:content;min-height:24px}
.fm-err{font-size:12px;color:var(--danger);padding-left:26px;min-height:0}
.fm-err:empty{display:none}
.fm-name::placeholder,.fm-desc::placeholder{color:var(--faint)}
.fmt{display:flex;align-items:center;gap:2px;padding:4px;border:1px solid var(--border);border-radius:10px;margin-bottom:16px;position:sticky;top:52px;background:var(--panel);z-index:4;flex-wrap:wrap}
.fmt .grow{flex:1}
.editable{outline:none;min-height:50vh;padding-bottom:30vh}
.editable:empty::before{content:attr(data-ph);color:var(--faint)}
.editable figure,.editable .tbl{position:relative}
.editable figure:hover,.editable .tbl:hover{outline:2px solid var(--accent-soft);border-radius:10px}
.raw{width:100%;min-height:60vh;border:1px solid var(--border);border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.65;background:var(--bg);resize:vertical;outline:none;field-sizing:content;color:var(--fg)}
.raw:focus{border-color:var(--accent)}
.save{width:28px;height:28px;display:grid;place-items:center;color:var(--faint)}
.save.ok{color:var(--ok)}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* folder list */
.fhead{display:flex;align-items:center;gap:12px;margin:10px 0 18px}
.fhead h1{font-size:26px;letter-spacing:-.02em;margin:0;font-weight:650}
.fhead .fic{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.items{border-top:1px solid var(--border)}
.item{display:grid;grid-template-columns:20px minmax(0,1fr) auto 48px 56px 24px;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:0;transition:background .1s}
.item:hover{background:var(--bg)}
.item .t{font-weight:500;color:var(--fg)}
.item .d{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .v,.item .w{font-size:12px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.empty{display:grid;place-items:center;gap:10px;padding:60px 0;color:var(--faint);text-align:center}
.empty .eic{width:52px;height:52px;border-radius:14px;background:var(--sunken);display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

# Writing a skill

## Frontmatter
- `name`: lowercase letters, digits and hyphens. Max 64 characters.
- `description`: one line that says when to use the skill. Max 1024 characters.

## Body
- Write instructions, not prose. Start each step with a verb.
- Keep the body under 150 lines. Move detail into linked documents.
- Link related documents with relative links, for example [hub-promote](./hub-promote.md).
- Use images only when a diagram replaces a paragraph.

## Never
- Put secrets, tokens or customer data in a skill.
- Copy content you are not allowed to share.

---
name: hub-promote
description: Use when a draft is ready to go live. Walks through review, commit and publish.
---
# Promoting a skill

1. Call `list_versions` and note the published version.
2. Call `diff_versions` from published to head. Show the diff to the human.
3. Check the frontmatter: `name` and `description` are present and accurate.
4. Call `commit_version` with a message that says what changed and why.
5. Call `publish_version` with the new version number.
6. Verify with `get_skill` and report the published version.

## Rules
- Never publish without showing the diff, unless the human says so explicitly.
- Never publish a document you have not read in full.
- One skill per publish.
- Always report the version number you published.

# Inspecting and changing access

1. Call `effective_access` for the person and folder in question.
2. Call `list_grants` on the folder to see direct and inherited grants.
3. To change access, call `grant_access` or `revoke_access`.
4. To isolate a folder, call `set_inherit` with `false`.

## Rules
- Confirm with the human before widening access.
- Prefer granting to a team over granting to a person.
- Report the resulting effective role after every change.

name: code-review
description: Use when reviewing a pull request. Checks correctness, tests and risk before style.
---
# Code review

## Order
1. Read the PR description and the linked ticket.
2. Check correctness: inputs, error paths, concurrency.
3. Check that tests cover the change, including one failure case.
4. Check risk: migrations, feature flags, rollback path.
5. Style last, and only if a linter would not catch it.

## Comments
- Prefix blocking comments with `blocker:`.
- Suggest code, do not describe it.
- Approve when the remaining comments are optional.

## Escalate
- Anything touching auth, billing or data deletion needs a second reviewer. See [secrets-handling](../Security/secrets-handling.md).

description: Use when production is degraded or down. Declares severity, assigns roles and drives to resolution.
---
# Incident runbook

## Declare
1. Open a channel named `inc-<date>-<slug>`.
2. Set severity with the matrix below.
3. Page the on-call lead for the affected service.

![Severity matrix](asset://a-sev)

| Severity | Customer impact | Update cadence |
|---|---|---|
| SEV1 | Outage or data loss | 15 min |
| SEV2 | Major feature degraded | 30 min |
| SEV3 | Minor, workaround exists | 2 h |

## Roles
- **Incident lead** owns decisions and the timeline.
- **Comms** posts status updates at the cadence above.
- **Scribe** records every action with a timestamp.

## Resolve
1. Mitigate first. Roll back before you debug.
2. Confirm recovery on the service dashboard for 15 minutes.
3. Close the channel with a one-line summary.

## After
- Write the postmortem within 3 business days.
- File follow-ups as tickets with an owner and a date.

name: sql-review
description: Use when reviewing SQL for analytics or migrations. Checks correctness, cost and safety.
---
# SQL review

## Correctness
- Every join states its keys. No implicit cross joins.
- `NULL` handling is explicit in filters and aggregates.
- Window functions declare `PARTITION BY` and `ORDER BY`.

## Cost
- Filter on partition columns first.
- Avoid `SELECT *` outside exploration.
- Check the query plan for full scans on tables over 10 GB.

## Safety
- Migrations are additive. Drop columns in a later release.
- `UPDATE` and `DELETE` run inside a transaction with a row count check.

function diffHtml(ops){const keep=new Set();ops.forEach((o,i)=>{if(o.t!==' ')for(let k=i-3;k<=i+3;k++)keep.add(k)});let h='',gap=0;const flush=()=>{if(gap){h+=`<tr class="g"><td colspan="3">${ic('more',14)} ${gap}</td></tr>`;gap=0}};
 ops.forEach((o,i)=>{if(o.t===' '&&!keep.has(i)){gap++;return}flush();h+=`<tr class="${o.t==='+'?'a':o.t==='-'?'d':''}"><td class="n">${o.a||''}</td><td class="n">${o.b||''}</td><td class="c"><span class="sg">${o.t===' '?'':o.t}</span>${esc(o.s)||' '}</td></tr>`});flush();
 if(!ops.some(o=>o.t!==' '))return `<div class="empty" style="padding:30px 0">${ic('check',20)}<span>Identical</span></div>`;return `<div class="diff"><table>${h}</table></div>`}

/* ---------- render: chrome ---------- */
const ib=(a,icon,tip,extra='')=>`<button class="ib" data-a="${a}" aria-label="${esc(tip.split('|')[0])}" data-tip="${esc(tip)}" ${extra}>${ic(icon,17)}</button>`;
function render(){const keep=snap();if(S.editing)syncEditor();const root=$('#root');
 if(S.screen==='login')root.innerHTML=loginHtml();else if(S.screen==='consent')root.innerHTML=consentHtml();else root.innerHTML=shellHtml();
 restore(keep);if(S.focusNext){const f=$(S.focusNext);S.focusNext=null;if(f){f.focus();if(f.select&&f.dataset.selectAll!==undefined)f.select()}}}
function snap(){const a=document.activeElement;const o={id:a&&a.id,ss:null,se:null,sc:{}};try{o.ss=a.selectionStart;o.se=a.selectionEnd}catch(e){}for(const s of ['.main','.tree-body','.drawer-body','.modal-body','.pal-list'])o.sc[s]=$(s)?.scrollTop;return o}
function restore(o){for(const s in o.sc){const e=$(s);if(e&&o.sc[s]!=null)e.scrollTop=o.sc[s]}if(o.id&&o.id!=='ed-body'){const e=document.getElementById(o.id);if(e){e.focus({preventScroll:true});try{if(o.ss!=null)e.setSelectionRange(o.ss,o.se)}catch(x){}}}}
function shellHtml(){const pm=['people','teams','team','audit','tokens','connections'].includes(S.view);const n=N(S.sel);const showDrawer=!pm&&S.drawer&&n&&canRead(n.id)&&S.view==='files';
 return `<div class="shell ${showDrawer?'with-drawer':''} ${pm?'page-mode':''} ${S.mTree?'m-tree':''}">${topHtml()}${railHtml()}<aside class="tree" aria-label="Folders">${treePane()}</aside><main class="main" id="main">${mainHtml()}</main><aside class="drawer" aria-label="Details">${showDrawer?drawerHtml():''}</aside><div class="scrim" data-a="scrim"></div></div>${menuHtml()}${modalHtml()}`}
function topHtml(){const u=me();return `<header class="top">

 <div class="search">${ic('search',16,'si')}<input id="q" data-in="q" placeholder="Search skills" autocomplete="off" spellcheck="false" value="${esc(S.q)}" aria-label="Search skills"><kbd>/</kbd>${S.searchOpen&&S.q.trim()?searchResHtml():''}</div>
 <div class="right">
  <button class="ib hide-m" data-a="palette" aria-label="Quick open" data-tip="Quick open|Ctrl K">${ic('command',17)}</button>

  <button class="ib" data-a="menu" data-m="user" aria-label="Account" data-tip="${esc(u.name)}" style="width:auto;padding:0 4px">${av(u.id,28)}</button>
 </div></header>`}
function railHtml(){const o=isOwner();const it=(v,icon,tip)=>`<button class="ib ${S.view===v||(v==='teams'&&S.view==='team')?'on':''}" data-a="go" data-v="${v}" aria-label="${tip}" data-tip="${tip}">${ic(icon,19)}</button>`;
 return `<nav class="rail">${it('files','folder','Library')}${o?it('people','user','People')+it('teams','users','Teams')+it('audit','activity','Audit'):''}<div class="sp"></div>${it('tokens','key','API tokens')}${it('connections','plug','Connections')}<button class="ib" data-a="theme" aria-label="Theme" data-tip="Theme">${ic(isDark()?'sun':'moon',18)}</button></nav>`}
function treePane(){const canRoot=isOwner();const hasTrash=DB.nodes.some(n=>n.deleted&&role(n.id)>=4);
 return `<div class="tree-head"><span class="lbl">Shared with me</span>${canRoot?`<button class="ib xs" data-a="new-folder" data-id="" aria-label="New folder" data-tip="New folder">${ic('folder-plus',15)}</button>`:''}<button class="ib xs" data-a="collapse" aria-label="Collapse all" data-tip="Collapse all">${ic('chev-d',15)}</button></div>

 ${hasTrash?`<div class="tree-foot"><button class="btn ghost sm ${S.view==='trash'?'on':''}" data-a="go" data-v="trash" style="color:var(--muted)">${ic('trash',14)}<span>Trash</span></button></div>`:''}`}
function treeRows(list,d){return list.map(n=>{const open=S.open.has(n.id),sel=S.sel===n.id&&S.view==='files';const mv=n.parent&&role(n.parent)>=4;let h=`<div class="row ${sel?'sel':''}" data-a="sel" data-id="${n.id}" data-kind="${n.kind}" draggable="${mv?'true':'false'}" style="--d:${d}" role="treeitem" aria-expanded="${n.kind==='folder'?open:''}">`;

function mark(n){if(role(n.id)<2)return '';const h=head(n),p=n.published;if(n.draft)return `<span class="mk dot" data-tip="Draft in progress"></span>`;if(p==null)return `<span class="mk ring" data-tip="Not published"></span>`;if(h>p)return `<span class="mk amber" data-tip="v${h} newer than published v${p}"></span>`;return `<span class="mk ok" data-tip="Published v${p}">${ic('check',13)}</span>`}

/* ---------- search ---------- */
function searchAll(q){const toks=q.toLowerCase().split(/\s+/).filter(Boolean);if(!toks.length)return{skills:[],names:[],toks};const last=toks.length-1;const skills=[];
 for(const d of DB.nodes){if(d.kind!=='doc'||!d.published||!canRead(d.id))continue;const{fm,body}=splitFM(vContent(d,d.published));if(!fm||!fm.name)continue;let sc=0;
  toks.forEach((t,i)=>{const re=new RegExp('\\b'+reEsc(t)+(i===last?'':'\\b'),'g');[[fm.name,4],[fm.description||'',2],[body,1]].forEach(([f,w])=>{sc+=(f.toLowerCase().match(re)||[]).length*w})});if(sc>0)skills.push({d,fm,body,sc})}
 skills.sort((a,b)=>b.sc-a.sc);const names=DB.nodes.filter(n=>canRead(n.id)&&toks.every(t=>n.name.toLowerCase().includes(t))&&!skills.some(s=>s.d.id===n.id)).slice(0,4);return{skills:skills.slice(0,6),names,toks}}
function hl(text,toks){const s=esc(text);if(!toks.length)return s;return s.replace(new RegExp('('+toks.map(t=>reEsc(esc(t))).join('|')+')','gi'),'<mark>$1</mark>')}
function snippet(body,toks){const plain=body.replace(/[#*`>|_\[\]()!-]+/g,' ').replace(/\s+/g,' ');const low=plain.toLowerCase();let i=-1;for(const t of toks){i=low.indexOf(t);if(i>=0)break}if(i<0)return '';const s=Math.max(0,i-40);return(s?'... ':'')+plain.slice(s,s+120)}
function searchResHtml(){const r=searchAll(S.q);const items=[...r.skills.map(s=>({id:s.d.id,html:`<span class="sk">${ic('sparkles',15)}</span><div class="grow"><div class="st">${hl(s.fm.name,r.toks)}</div><div class="sd">${hl(s.fm.description||'',r.toks)}</div>${snippet(s.body,r.toks)?`<div class="sp">${hl(snippet(s.body,r.toks),r.toks)}</div>`:''}</div><span class="faint" style="font-size:11.5px;white-space:nowrap">${esc(visPathStr(s.d.parent))}</span>`})),...r.names.map(n=>({id:n.id,html:`<span class="faint">${ic(n.kind==='folder'?'folder':'file',15)}</span><div class="grow"><div style="font-size:13px">${hl(n.name,r.toks)}</div></div><span class="faint" style="font-size:11.5px">${esc(visPathStr(n.parent))}</span>`}))];
 S._sItems=items.map(i=>i.id);if(!items.length)return `<div class="sres"><div class="empty" style="padding:24px 0">${ic('search',18)}<span>No matches</span></div></div>`;
 return `<div class="sres" role="listbox">${items.map((it,i)=>`<button class="sr ${i===S.sIdx?'on':''}" data-a="go-node" data-id="${it.id}" role="option">${it.html}</button>`).join('')}</div>`}

function mainHtml(){switch(S.view){case 'people':return peopleHtml();case 'teams':return teamsHtml();case 'team':return teamHtml();case 'audit':return auditHtml();case 'tokens':return tokensHtml();case 'connections':return connsHtml();case 'trash':return trashHtml()}const n=N(S.sel);if(!n||!canRead(n.id))return homeHtml();return n.kind==='doc'?docHtml(n):folderHtml(n)}
function crumbs(id){const p=visPath(id);return p.map((n,i)=>i===p.length-1?`<span class="cur">${ic(n.kind==='folder'?'folder':'file',14)}${esc(n.name)}</span>`:`<button data-a="go-node" data-id="${n.id}">${esc(n.name)}</button>${ic('chev-r',12)}`).join('')}

function docMetaContent(d){if(role(d.id)>=2)return latestContent(d);return d.published?vContent(d,d.published):''}
function folderHtml(f){const r=role(f.id);const items=kids(f.id);
 return `<div class="page"><div class="dh"><nav class="crumbs">${crumbs(f.id)}</nav><div class="acts">
 ${r>=2?ib('new-doc','file-plus','New document')+ib('new-folder','folder-plus','New folder',`data-id="${f.id}"`):''}${r>=4?ib('share','user-plus','Share'):''}${ib('drawer','panel-right','Details','class="hide-m"')}${r>=4?ib('menu','more','More',`data-m="more" data-id="${f.id}"`):''}</div></div>

 ${items.length?`<div class="items">${items.map(n=>{if(n.kind==='folder'){const c=kids(n.id).length;return `<div class="item" data-a="go-node" data-id="${n.id}"><span class="faint">${ic('folder',17)}</span><div style="min-width:0"><div class="t ell">${esc(n.name)}</div></div><span class="faint" style="font-size:12px">${c}</span><span class="v"></span><span class="w"></span><span></span></div>`}
  const{fm}=splitFM(docMetaContent(n));const rv=role(n.id);const last=rv>=2?(n.draft?n.draft.ts:head(n)?n.versions[head(n)-1].ts:n.created):n.versions[n.published-1].ts;const by=rv>=2?(n.draft?n.draft.by:head(n)?n.versions[head(n)-1].by:n.by):n.versions[n.published-1].by;
  return `<div class="item" data-a="go-node" data-id="${n.id}"><span class="${fm&&fm.name?'':'faint'}" style="${fm&&fm.name?'color:var(--accent)':''}">${ic(fm&&fm.name?'sparkles':'file',17)}</span><div style="min-width:0"><div class="t ell">${esc(n.name)}</div>${fm&&fm.description?`<div class="d">${esc(fm.description)}</div>`:''}</div>${mark(n)||'<span></span>'}<span class="v">${rv>=2?(head(n)?'v'+head(n):''):'v'+n.published}</span><span class="w">${ago(last)}</span>${av(by,22)}</div>`}).join('')}</div>`
 :`<div class="empty"><span class="eic">${ic('folder-open',22)}</span>${r>=2?`<div class="row-flex"><button class="btn sm" data-a="new-doc">${ic('file-plus',14)}<span>Document</span></button><button class="btn sm" data-a="new-folder" data-id="${f.id}">${ic('folder-plus',14)}<span>Folder</span></button></div>`:''}</div>`}</div>`}
function pillHtml(d){const h=head(d),p=d.published;let x='';x+=p?`<span class="pp ok">${ic('check',11)}v${p}</span>`:`<span class="pp mute">${ic('eye-off',11)}</span>`;if(h>(p||0))x+=`<span class="pp warn">+${h-(p||0)}</span>`;if(d.draft)x+=`<span class="pp dot"></span>`;
 const tip=(p?'Published v'+p:'Not published')+(h>(p||0)?', '+(h-(p||0))+' newer':'')+(d.draft?', draft':'');return `<button class="pill-btn" data-a="menu" data-m="versions" data-id="${d.id}" aria-label="Versions" data-tip="${tip}">${x}${ic('chev-d',13)}</button>`}

  else if(r>=2&&v!==d.published)banner=`<div class="banner old">${ic('clock',15)}<div class="grow"><b>v${v}</b><span class="muted">${d.published?'published is v'+d.published:'not published'}</span></div>${d.published?`<button class="btn sm" data-a="view" data-v="${d.published}" data-tip="Show published">${ic('back',13)}</button>`:''}<button class="btn sm" data-a="diff-open" data-v="${v}" data-tip="Compare">${ic('diff',13)}</button>${r>=3?`<button class="btn sm primary" data-a="publish-open" data-v="${v}">${ic('rocket',13)}<span>Publish v${v}</span></button>`:''}</div>`;
  body=`${fm&&fm.name?`<div class="skill-card"><span class="sk" data-tip="Skill, visible to agents">${ic('sparkles',16)}</span><div class="grow"><code>${esc(fm.name)}</code><p>${esc(fm.description||'')}</p></div></div>`:''}<article class="md">${renderMd(b)}</article>`}
 return `<div class="page"><div class="dh"><nav class="crumbs">${crumbs(d.id)}</nav><div class="acts">${acts}</div></div>${banner}${body}</div>`}
function saveIcon(){const s=S.edit?.save;return s==='saving'?ic('loader',16,'spin'):s==='pending'?ic('cloud',16):ic('cloud-check',16)}

 return `<div class="page"><div class="dh"><nav class="crumbs">${crumbs(d.id)}</nav><div class="acts">

 <div class="fmt" role="toolbar">${E.raw?'':[['h2','heading','Heading'],['bold','bold','Bold|Ctrl B'],['italic','italic','Italic|Ctrl I'],['ul','list','List'],['ol','list-ol','Numbered list'],['quote','quote','Quote'],['code','code-block','Code block']].map(([c,i,t])=>`<button class="ib sm" data-a="fmt" data-cmd="${c}" aria-label="${t.split('|')[0]}" data-tip="${t}">${ic(i,16)}</button>`).join('')+'<span class="sep"></span>'}

/* ---------- drawer ---------- */
function drawerHtml(){const n=N(S.sel);const r=role(n.id);const tabs=[];if(n.kind==='doc'&&r>=2)tabs.push(['history','history','History']);tabs.push(['access','users','Access']);if(r>=2)tabs.push(['activity','activity','Activity']);let tab=S.drawer;if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
 const body=tab==='history'?historyHtml(n):tab==='access'?accessHtml(n):activityHtml(n);

function historyHtml(d){const cur=currentView(d),p=d.published,cp=role(d.id)>=3;let h='';
 if(d.draft)h+=`<button class="hrow ${cur==='draft'?'cur':''}" data-a="view" data-v="draft"><span class="vn dr">${ic('pencil',12)}</span><div class="hmain"><div class="ht">Draft</div><div class="hs">${av(d.draft.by,16)}${esc(U(d.draft.by).name.split(' ')[0])} · ${ago(d.draft.ts)}</div></div><div class="hact"><span class="ib xs" data-a="diff-open" data-v="draft" data-tip="Compare with v${head(d)||0}">${ic('diff',14)}</span></div></button>`;
 for(let n=head(d);n>=1;n--){const v=d.versions[n-1];h+=`<div class="hrow ${cur===n?'cur':''}" data-a="view" data-v="${n}" role="button" tabindex="0"><span class="vn">v${n}</span><div class="hmain"><div class="ht">${esc(v.msg)}</div><div class="hs">${av(v.by,16)}${esc(U(v.by).name.split(' ')[0])} · ${ago(v.ts)}</div></div><div class="hact">${n>1?`<span class="ib xs" data-a="diff-open" data-v="${n}" data-tip="Compare with v${n-1}">${ic('diff',14)}</span>`:''}${cp&&n!==p?`<span class="ib xs" data-a="publish-open" data-v="${n}" data-tip="${n<(p||0)?'Roll back to':'Publish'} v${n}">${ic(n<(p||0)?'undo':'rocket',14)}</span>`:''}</div>${n===p?`<span class="hb" data-tip="Published">${ic('check',15,'').replace('class="i ','class="i " style="color:var(--ok)" ')}</span>`:''}</div>`}
 if(!h)h=`<div class="empty" style="padding:40px 0">${ic('history',20)}</div>`;return h}
function chainGrants(f){const out=[];let x=f,first=true;while(x){for(const g of DB.grants)if(g.node===x.id)out.push({g,from:first?null:x});if(!x.inherit)break;x=x.parent?N(x.parent):null;first=false}return out}

/* ---------- actions ---------- */

document.addEventListener('paste',e=>{if(!S.editing)return;const inBody=e.target.closest&&e.target.closest('#ed-body');const inRaw=e.target.id==='ed-raw';if(!inBody&&!inRaw)return;const f=[...(e.clipboardData?.files||[])][0];if(f){e.preventDefault();insertImage(f);return}if(inBody){e.preventDefault();const t=e.clipboardData.getData('text/plain');document.execCommand('insertText',false,t);S.edit.dirty=true;scheduleSave()}});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f&&S.editing)insertImage(f)});
/* drag and drop */
let hoverT=null;
document.addEventListener('dragstart',e=>{const r=e.target.closest&&e.target.closest('.row[draggable="true"]');if(!r)return;S.drag=r.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',S.drag);r.classList.add('dragging')});
function canDrop(id,dest){const n=N(id);return dest!==id&&!isDesc(dest,id)&&dest!==n.parent&&role(n.parent)>=4&&role(dest)>=4}
document.addEventListener('dragover',e=>{if(S.drag){const r=e.target.closest('.row[data-kind="folder"]');document.querySelectorAll('.row.drop').forEach(x=>x!==r&&x.classList.remove('drop'));if(r&&canDrop(S.drag,r.dataset.id)){e.preventDefault();e.dataTransfer.dropEffect='move';if(!r.classList.contains('drop')){r.classList.add('drop');clearTimeout(hoverT);hoverT=setTimeout(()=>{if(!S.open.has(r.dataset.id)){S.open.add(r.dataset.id);const tb=$('#tree-body');tb.innerHTML=treeRows(roots(),0)}},700)}}return}
 if(e.target.closest&&e.target.closest('#ed-body,#ed-raw')&&e.dataTransfer.types.includes('Files'))e.preventDefault()});
document.addEventListener('drop',e=>{if(S.drag){const r=e.target.closest('.row[data-kind="folder"]');const id=S.drag;S.drag=null;clearTimeout(hoverT);if(r&&canDrop(id,r.dataset.id)){e.preventDefault();moveNode(id,r.dataset.id)}else render();return}
 if(e.target.closest&&e.target.closest('#ed-body,#ed-raw')){const f=e.dataTransfer.files[0];if(f){e.preventDefault();insertImage(f)}}});
document.addEventListener('dragend',()=>{if(S.drag){S.drag=null;clearTimeout(hoverT);document.querySelectorAll('.dragging,.drop').forEach(x=>x.classList.remove('dragging','drop'))}});
/* tooltip */
let tipT=null,tipFor=null;const tip=$('#tip');
function hideTip(){clearTimeout(tipT);tipFor=null;tip.classList.remove('on')}
document.addEventListener('pointerover',e=>{const t=e.target.closest('[data-tip]');if(t===tipFor)return;hideTip();if(!t||e.pointerType==='touch'||t.classList.contains('armed'))return;tipFor=t;tipT=setTimeout(()=>{if(!document.body.contains(t))return;const[label,key]=t.dataset.tip.split('|');tip.innerHTML=esc(label)+(key?`<kbd>${esc(key)}</kbd>`:'');const r=t.getBoundingClientRect(),tr=tip.getBoundingClientRect();let x,y;if(t.closest('.rail')){x=r.right+8;y=r.top+r.height/2-tr.height/2}else{x=r.left+r.width/2-tr.width/2;y=r.bottom+6;if(y+tr.height>innerHeight-8)y=r.top-tr.height-6}x=Math.max(8,Math.min(innerWidth-tr.width-8,x));tip.style.left=x+'px';tip.style.top=y+'px';tip.classList.add('on')},350)});
['pointerdown','scroll','keydown'].forEach(ev=>document.addEventListener(ev,hideTip,true));

(function(){const t=store.get('sh-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;render()})();
