<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillHub Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: icon rail | lazy tree | reading column | details drawer. Quiet neutrals with a faint blue bias, one accent. */
:root{
  --bg:#f6f7f9;--panel:#ffffff;--sunken:#f1f3f6;--hover:#eceff4;--border:#e3e6eb;--border-2:#d2d7df;
  --fg:#0f172a;--fg-2:#334155;--muted:#64748b;--faint:#97a1b2;
  --accent:#2563eb;--accent-2:#1d4ed8;--accent-soft:#e8f0fe;--accent-fg:#ffffff;
  --ok:#15803d;--ok-soft:#e6f5eb;--warn:#b45309;--warn-dot:#f59e0b;--warn-soft:#fdf2e0;--danger:#dc2626;--danger-soft:#fdeceb;
  --add:#e7f6eb;--add-fg:#166534;--del:#fdeceb;--del-fg:#991b1b;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.08);
  --shadow-lg:0 2px 6px rgba(15,23,42,.06),0 24px 56px rgba(15,23,42,.18);
  --scrim:rgba(15,23,42,.28);--av-bg:91%;--av-fg:32%;--tip-bg:#0f172a;--tip-fg:#f8fafc;--mark:#fde68a;--mark-fg:#0f172a;
  --font:'Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --c-rules:#7c3aed;--c-skills:#2563eb;--c-docs:#0d9488;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0c10;--panel:#0f1217;--sunken:#151920;--hover:#1a1f28;--border:#20262f;--border-2:#2d3440;
  --fg:#e6e9ef;--fg-2:#c3c9d3;--muted:#8b94a3;--faint:#5c6575;
  --accent:#4b8af5;--accent-2:#6d9ff7;--accent-soft:rgba(75,138,245,.15);--accent-fg:#ffffff;
  --ok:#43b56d;--ok-soft:rgba(67,181,109,.14);--warn:#e5a143;--warn-dot:#e5a143;--warn-soft:rgba(229,161,67,.14);--danger:#f2615b;--danger-soft:rgba(242,97,91,.14);
  --add:rgba(67,181,109,.13);--add-fg:#7fd9a0;--del:rgba(242,97,91,.13);--del-fg:#f6a19c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 56px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.55);--av-bg:24%;--av-fg:80%;--tip-bg:#e6e9ef;--tip-fg:#0a0c10;--mark:rgba(229,161,67,.35);--mark-fg:#fff;--c-rules:#a78bfa;--c-skills:#5b93f7;--c-docs:#2dd4bf;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0c10;--panel:#0f1217;--sunken:#151920;--hover:#1a1f28;--border:#20262f;--border-2:#2d3440;
  --fg:#e6e9ef;--fg-2:#c3c9d3;--muted:#8b94a3;--faint:#5c6575;
  --accent:#4b8af5;--accent-2:#6d9ff7;--accent-soft:rgba(75,138,245,.15);--accent-fg:#ffffff;
  --ok:#43b56d;--ok-soft:rgba(67,181,109,.14);--warn:#e5a143;--warn-dot:#e5a143;--warn-soft:rgba(229,161,67,.14);--danger:#f2615b;--danger-soft:rgba(242,97,91,.14);
  --add:rgba(67,181,109,.13);--add-fg:#7fd9a0;--del:rgba(242,97,91,.13);--del-fg:#f6a19c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 56px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.55);--av-bg:24%;--av-fg:80%;--tip-bg:#e6e9ef;--tip-fg:#0a0c10;--mark:rgba(229,161,67,.35);--mark-fg:#fff;--c-rules:#a78bfa;--c-skills:#5b93f7;--c-docs:#2dd4bf;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.i{flex:none;display:block}
#root{height:100%}
code,kbd,.mono{font-family:var(--mono)}
kbd{font-size:11px;padding:1px 5px;border:1px solid var(--border-2);border-bottom-width:2px;border-radius:5px;color:var(--muted);background:var(--panel)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* controls */
.ib{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;color:var(--muted);transition:background .12s,color .12s}
.ib:hover{background:var(--hover);color:var(--fg)}
.ib.on{color:var(--accent);background:var(--accent-soft)}
.ib.sm{width:28px;height:28px}.ib.xs{width:24px;height:24px;border-radius:6px}
.ib:disabled{opacity:.35;pointer-events:none}
.ib.armed,.btn.armed{background:var(--danger)!important;color:#fff!important;width:auto;padding:0 10px;gap:6px;display:inline-flex;align-items:center;font-size:12.5px;font-weight:500}
.btn{height:32px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border-radius:8px;border:1px solid var(--border-2);background:var(--panel);font-weight:500;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s,opacity .12s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.input,.select{height:34px;border:1px solid var(--border-2);background:var(--panel);border-radius:8px;padding:0 10px;min-width:0;transition:border-color .12s,box-shadow .12s}
.input:focus,.select:focus,textarea.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
.select{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 10px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.select.bare{border-color:transparent;background-color:transparent;height:30px;font-size:13px;color:var(--fg-2)}
.select.bare:hover{background-color:var(--hover)}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:var(--sunken);color:var(--fg-2);font-size:12px;font-weight:500;white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.switch{position:relative;width:34px;height:20px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--border-2);transition:background .15s}
.switch span::after{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(14px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.cb{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
.av{--s:24px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;flex:none;font-size:calc(var(--s)*.4);font-weight:600;letter-spacing:.02em;background:hsl(var(--h) 55% var(--av-bg));color:hsl(var(--h) 45% var(--av-fg))}
.av.sq{border-radius:calc(var(--s)*.28)}
.av.ev{background:var(--accent-soft);color:var(--accent)}
.av.cl{background:var(--sunken);color:var(--fg-2);border:1px solid var(--border)}
.stack{display:inline-flex}.stack .av{box-shadow:0 0 0 2px var(--panel)}.stack .av+.av{margin-left:-6px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.row-flex{display:flex;align-items:center;gap:8px;min-width:0}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sep{width:1px;height:18px;background:var(--border);margin:0 4px;flex:none}

/* shell */
.shell{display:grid;height:100%;grid-template-rows:52px minmax(0,1fr);grid-template-columns:56px 272px minmax(0,1fr) 0;grid-template-areas:"top top top top" "rail tree main drawer";transition:grid-template-columns .2s ease}
.shell.with-drawer{grid-template-columns:56px 272px minmax(0,1fr) 352px}
.shell.page-mode{grid-template-columns:56px 0 minmax(0,1fr) 0}
.shell:not(.with-drawer) .drawer,.shell.page-mode .drawer,.shell.page-mode .tree{display:none}
.top{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;border-bottom:1px solid var(--border);background:var(--panel);min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;font-size:14.5px;flex:none;width:300px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.brand .org{color:var(--faint);font-weight:500}
.search{position:relative;flex:1;max-width:560px;min-width:0}
.search .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{width:100%;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--sunken);padding:0 34px 0 34px;transition:background .12s,border-color .12s,box-shadow .12s}
.search input:focus{outline:none;background:var(--panel);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:4px}
.mbtn{display:none}
.rail{grid-area:rail;border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
.rail .ib{width:38px;height:38px;border-radius:10px}
.rail .sp{flex:1}
.tree{grid-area:tree;border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tree-head{display:flex;align-items:center;gap:2px;padding:12px 10px 6px 16px;flex:none}
.tree-head .lbl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);flex:1}
.tree-body{flex:1;overflow:auto;padding:2px 8px 12px}
.tree-foot{border-top:1px solid var(--border);padding:6px 8px;display:flex;gap:2px}
.row{--d:0;display:flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 calc(6px + var(--d)*16px);border-radius:7px;cursor:pointer;user-select:none;color:var(--fg-2);position:relative}
.row:hover{background:var(--hover)}
.row.sel{background:var(--accent-soft);color:var(--fg)}
.row.sel .ri{color:var(--accent)}
.row .tw{width:16px;height:16px;display:grid;place-items:center;color:var(--faint);transition:transform .15s;flex:none;border-radius:4px}
.row .tw:hover{color:var(--fg)}
.row .tw.open{transform:rotate(90deg)}
.row .ri{color:var(--faint)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.row .lk{color:var(--faint);display:grid}
.row .more{opacity:0}
.row:hover .more,.row.sel .more{opacity:1}
.row.drop{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.row.dragging{opacity:.4}
.row input{flex:1;min-width:0;height:24px;border:1px solid var(--accent);border-radius:5px;padding:0 6px;background:var(--panel);font-size:13px;outline:none}
.mk{width:16px;height:16px;display:grid;place-items:center;flex:none}
.mk::before{content:"";width:7px;height:7px;border-radius:50%}
.mk.dot::before{background:var(--accent)}
.mk.amber::before{background:var(--warn-dot)}
.mk.ring::before{border:1.5px solid var(--faint);width:5px;height:5px}
.mk.ok::before{display:none}.mk.ok{color:var(--ok)}
.empty-row{padding:4px 0 4px calc(30px + var(--d)*16px);font-size:12px;color:var(--faint);height:26px;display:flex;align-items:center}
.main{grid-area:main;overflow:auto;min-width:0;background:var(--panel);position:relative}
.drawer{grid-area:drawer;border-left:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.dtabs{display:flex;align-items:center;gap:2px;padding:10px 10px 10px 12px;border-bottom:1px solid var(--border);flex:none}
.dtabs .t{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;color:var(--muted);font-size:13px;font-weight:500}
.dtabs .t:hover{background:var(--hover);color:var(--fg)}
.dtabs .t.on{background:var(--sunken);color:var(--fg)}
.dtabs .t span{display:none}.dtabs .t.on span{display:inline}
.drawer-body{flex:1;overflow:auto;padding:12px}
.scrim{display:none}

/* page */
.page{max-width:820px;margin:0 auto;padding:18px 32px 96px}
.page.wide{max-width:1120px}
.dh{display:flex;align-items:center;gap:8px;min-height:36px;position:sticky;top:0;background:var(--panel);z-index:5;padding:8px 0;margin:-8px 0 8px}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;font-size:13px;color:var(--muted);overflow:hidden}
.crumbs button{padding:3px 6px;border-radius:6px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.crumbs button:hover{background:var(--hover);color:var(--fg)}
.crumbs .cur{color:var(--fg);font-weight:500;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:6px}
.crumbs .i{color:var(--faint)}
.acts{display:flex;align-items:center;gap:2px;flex:none}
.pill-btn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 6px 0 4px;border-radius:8px;border:1px solid var(--border);margin-right:6px;color:var(--muted);transition:background .12s}
.pill-btn:hover{background:var(--hover)}
.pp{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 6px;border-radius:6px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.pp.ok{background:var(--ok-soft);color:var(--ok)}
.pp.warn{background:var(--warn-soft);color:var(--warn)}
.pp.mute{background:var(--sunken);color:var(--muted)}
.pp.dot{width:8px;height:8px;padding:0;border-radius:50%;background:var(--accent);margin:0 3px}
.banner{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--sunken);margin:4px 0 18px;font-size:13px;color:var(--fg-2)}
.banner.draft{background:var(--accent-soft)}
.banner.old{background:var(--warn-soft)}
.banner .grow{display:flex;align-items:center;gap:8px;min-width:0}
.banner b{font-weight:600}
.skill-card{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin:6px 0 22px;background:var(--bg)}
.skill-card .sk{color:var(--accent);margin-top:2px}
.skill-card code{font-size:12px;color:var(--muted)}
.skill-card p{margin:2px 0 0;color:var(--fg-2);font-size:14px;line-height:1.5}

/* markdown */
.md{font-size:15px;line-height:1.7;color:var(--fg-2);max-width:68ch;overflow-wrap:break-word}
.md>*:first-child{margin-top:0}
.md h1{font-size:30px;line-height:1.2;letter-spacing:-.02em;color:var(--fg);margin:8px 0 18px;font-weight:650;text-wrap:balance}
.md h2{font-size:19px;color:var(--fg);margin:30px 0 10px;font-weight:600;letter-spacing:-.01em}
.md h3{font-size:16px;color:var(--fg);margin:22px 0 8px;font-weight:600}
.md p{margin:0 0 14px}
.md ul,.md ol{margin:0 0 14px;padding-left:22px}
.md li{margin:3px 0}
.md li::marker{color:var(--faint)}
.md code{font-size:.86em;background:var(--sunken);border:1px solid var(--border);padding:1px 5px;border-radius:5px;color:var(--fg)}
.md pre{background:var(--sunken);border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow:auto;font-size:13px;line-height:1.55}
.md pre code{background:none;border:0;padding:0}
.md blockquote{margin:0 0 14px;padding:2px 0 2px 14px;border-left:3px solid var(--border-2);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--border);margin:24px 0}
.md a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.md a:hover{border-bottom-color:var(--accent)}
.md a.int{display:inline-flex;align-items:center;gap:3px;border:0;background:var(--accent-soft);padding:0 6px;border-radius:6px;font-size:.93em;cursor:pointer}
.md .tbl{overflow-x:auto;margin:0 0 16px;border:1px solid var(--border);border-radius:10px}
.md table{border-collapse:collapse;width:100%;font-size:13.5px}
.md th,.md td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border)}
.md th{font-weight:600;color:var(--fg);background:var(--bg)}
.md tr:last-child td{border-bottom:0}
.md figure{margin:6px 0 18px}
.md figure img{border-radius:10px;border:1px solid var(--border);display:block;max-width:100%}
.md figcaption{font-size:12px;color:var(--faint);margin-top:6px}
.md .ph{height:120px;border-radius:10px;border:1px dashed var(--border-2);display:grid;place-items:center;color:var(--faint)}
.md mark{background:var(--mark);color:var(--mark-fg);border-radius:3px;padding:0 1px}

/* editor */
.fm-card{border:1px solid var(--border);border-radius:12px;padding:12px 14px 10px;margin:4px 0 12px;background:var(--bg);transition:border-color .12s}
.fm-card:focus-within{border-color:var(--accent)}
.fm-row{display:flex;align-items:center;gap:10px;color:var(--accent)}
.fm-name{flex:1;border:0;background:none;font-family:var(--mono);font-size:14px;color:var(--fg);outline:none;padding:2px 0;min-width:0}
.fm-desc{width:100%;border:0;background:none;resize:none;outline:none;color:var(--fg-2);font-size:14px;line-height:1.5;padding:4px 0 0 26px;field-sizing:content;min-height:24px}
.fm-err{font-size:12px;color:var(--danger);padding-left:26px;min-height:0}
.fm-err:empty{display:none}
.fm-name::placeholder,.fm-desc::placeholder{color:var(--faint)}
.fmt{display:flex;align-items:center;gap:2px;padding:4px;border:1px solid var(--border);border-radius:10px;margin-bottom:16px;position:sticky;top:52px;background:var(--panel);z-index:4;flex-wrap:wrap}
.fmt .grow{flex:1}
.editable{outline:none;min-height:50vh;padding-bottom:30vh}
.editable:empty::before{content:attr(data-ph);color:var(--faint)}
.editable figure,.editable .tbl{position:relative}
.editable figure:hover,.editable .tbl:hover{outline:2px solid var(--accent-soft);border-radius:10px}
.raw{width:100%;min-height:60vh;border:1px solid var(--border);border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.65;background:var(--bg);resize:vertical;outline:none;field-sizing:content;color:var(--fg)}
.raw:focus{border-color:var(--accent)}
.save{width:28px;height:28px;display:grid;place-items:center;color:var(--faint)}
.save.ok{color:var(--ok)}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* folder list */
.fhead{display:flex;align-items:center;gap:12px;margin:10px 0 18px}
.fhead h1{font-size:26px;letter-spacing:-.02em;margin:0;font-weight:650}
.fhead .fic{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.items{border-top:1px solid var(--border)}
.item{display:grid;grid-template-columns:20px minmax(0,1fr) auto 48px 56px 24px;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:0;transition:background .1s}
.item:hover{background:var(--bg)}
.item .t{font-weight:500;color:var(--fg)}
.item .d{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .v,.item .w{font-size:12px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.empty{display:grid;place-items:center;gap:10px;padding:60px 0;color:var(--faint);text-align:center}
.empty .eic{width:52px;height:52px;border-radius:14px;background:var(--sunken);display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;transition:border-color .12s,box-shadow .12s;background:var(--panel)}
.tile:hover{border-color:var(--border-2);box-shadow:var(--shadow)}
.tile .fic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile b{font-weight:600}

/* drawer content */
.hrow{display:flex;align-items:flex-start;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer;width:100%;text-align:left;position:relative}
.hrow:hover{background:var(--hover)}
.hrow.cur{background:var(--accent-soft)}
.vn{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--fg-2);width:30px;height:22px;border-radius:6px;background:var(--sunken);display:grid;place-items:center;flex:none}
.hrow.cur .vn{background:var(--panel);color:var(--accent)}
.vn.dr{background:var(--accent);color:#fff}
.hmain{flex:1;min-width:0}
.ht{font-size:13px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hs{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:2px}
.hact{display:flex;gap:0;opacity:0;transition:opacity .12s}
.hrow:hover .hact{opacity:1}
.hb{display:flex;align-items:center}
.sec{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:14px 8px 6px}
.sec:first-child{margin-top:2px}
.prow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px}
.prow .pn{font-size:13px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .ps{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.inh .pn,.prow.inh .ps,.prow.inh .rl{color:var(--faint)}
.prow.inh .av{opacity:.6}
.rl{font-size:12.5px;color:var(--fg-2);white-space:nowrap}
.arow{display:flex;gap:10px;padding:8px;align-items:center;border-radius:9px}
.arow .aic{width:28px;height:28px;border-radius:8px;background:var(--sunken);color:var(--muted);display:grid;place-items:center;flex:none}
.arow .aic.ok{color:var(--ok);background:var(--ok-soft)}
.arow .aic.bad{color:var(--danger);background:var(--danger-soft)}
.arow .aic.acc{color:var(--accent);background:var(--accent-soft)}
.note{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;margin:6px 0}

/* menus, modals */
.menu{position:fixed;z-index:60;min-width:200px;max-width:320px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:5px;animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:7px;font-size:13px;color:var(--fg-2);text-align:left}
.mi:hover{background:var(--hover);color:var(--fg)}
.mi .i{color:var(--muted)}
.mi.dz,.mi.dz .i{color:var(--danger)}
.mi.on{background:var(--accent-soft);color:var(--fg)}
.mi .r{margin-left:auto;color:var(--faint);font-size:12px}
.mhr{height:1px;background:var(--border);margin:5px 3px}
.mlbl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:8px 9px 4px}
.modal-wrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.modal-scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:80vh;display:flex;flex-direction:column;animation:rise .18s cubic-bezier(.2,.9,.3,1.2)}
.modal.lg{max-width:760px}.modal.sm{max-width:420px}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.985)}}
.mh{display:flex;align-items:center;gap:10px;padding:14px 14px 10px 18px}
.mh h2{margin:0;font-size:15px;font-weight:600;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.mh h2 .i{color:var(--muted)}
.modal-body{padding:4px 18px 14px;overflow:auto}
.mf{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
.mf .grow{flex:1}
.addrow{display:flex;gap:8px;position:relative}
.addrow .input{flex:1}
.sugg{position:absolute;top:38px;left:0;right:0;z-index:5;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:4px;max-height:240px;overflow:auto}
.picked{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 4px;border:1px solid var(--accent);border-radius:8px;background:var(--accent-soft);flex:1;min-width:0}
.diff{font-family:var(--mono);font-size:12.5px;line-height:1.6;border:1px solid var(--border);border-radius:10px;overflow:auto;background:var(--panel)}
.diff table{border-collapse:collapse;width:100%}
.diff td{padding:0 10px;white-space:pre-wrap;word-break:break-word;vertical-align:top}
.diff td.n{width:1%;white-space:nowrap;color:var(--faint);text-align:right;user-select:none;padding:0 6px;font-size:11.5px}
.diff tr.a{background:var(--add)}.diff tr.a td.c{color:var(--add-fg)}
.diff tr.d{background:var(--del)}.diff tr.d td.c{color:var(--del-fg)}
.diff tr.g td{background:var(--sunken);color:var(--faint);text-align:center;font-size:11.5px;padding:2px}
.diff .sg{display:inline-block;width:12px;color:inherit;opacity:.7}
.stat{font-family:var(--mono);font-size:12px;display:inline-flex;gap:8px}
.stat .p{color:var(--ok)}.stat .m{color:var(--danger)}
.vchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.vchip{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--border);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-family:var(--mono)}
.vchip:hover{background:var(--hover)}
.vchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vchip .i{color:var(--ok)}
.tokbox{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px;border-radius:10px;background:var(--sunken);font-family:var(--mono);font-size:13px;word-break:break-all;border:1px solid var(--border)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-size:12px;font-weight:500;color:var(--muted)}
.scopes{display:flex;flex-direction:column;gap:2px}
.scope{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;cursor:pointer}
.scope:hover{background:var(--hover)}
.scope .sic{width:30px;height:30px;border-radius:8px;background:var(--sunken);display:grid;place-items:center;color:var(--muted);flex:none}
.scope.on .sic{background:var(--accent-soft);color:var(--accent)}
.scope.dis{opacity:.5;cursor:not-allowed}
.scope .st{font-weight:500;font-size:13.5px}.scope .sd{font-size:12px;color:var(--muted)}
.pal{max-width:600px}
.pal-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.pal-in input{flex:1;border:0;background:none;outline:none;font-size:15px}
.pal-list{max-height:52vh;overflow:auto;padding:6px}
.pi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.pi.on{background:var(--accent-soft)}
.pi .i{color:var(--muted)}
.pi .ps{margin-left:auto;font-size:12px;color:var(--faint);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi mark,.sr mark{background:none;color:var(--accent);font-weight:600}
.sres{position:absolute;top:40px;left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:40;max-height:70vh;overflow:auto;animation:pop .12s ease-out}
.sr{display:flex;gap:10px;padding:9px 10px;border-radius:9px;width:100%;text-align:left;align-items:flex-start}
.sr.on,.sr:hover{background:var(--hover)}
.sr .sk{color:var(--accent);margin-top:2px}
.sr .st{font-weight:500;font-family:var(--mono);font-size:13px}
.sr .sd{font-size:12.5px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sr .sp{font-size:11.5px;color:var(--faint);margin-top:3px}
.sr .sd mark,.sr .sp mark{background:var(--mark);color:var(--mark-fg);font-weight:500;border-radius:3px;padding:0 1px}

/* tables */
.ph1{display:flex;align-items:center;gap:12px;margin:8px 0 18px;flex-wrap:wrap}
.ph1 h1{font-size:24px;letter-spacing:-.02em;margin:0;font-weight:650;display:flex;align-items:center;gap:10px}
.ph1 .count{font-size:13px;color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.ph1 .grow{flex:1}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.qwrap{position:relative;flex:1;min-width:180px;max-width:320px}
.qwrap .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.qwrap .input{width:100%;padding-left:32px}
.tw-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:9px 12px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:var(--bg)}
table.t tr.selr td{background:var(--accent-soft)}
table.t .num{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.bulk{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:10px;background:var(--fg);color:var(--panel);margin-bottom:12px;animation:pop .12s}
.bulk .btn{background:transparent;border-color:color-mix(in srgb,var(--panel) 25%,transparent);color:var(--panel)}
.bulk .btn:hover{background:color-mix(in srgb,var(--panel) 12%,transparent)}
.bulk .grow{font-size:13px;font-weight:500}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--sunken);gap:2px}
.seg button{height:28px;min-width:30px;padding:0 8px;border-radius:7px;display:inline-grid;place-items:center;color:var(--muted);font-size:12.5px}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{height:38px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;font-size:13px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .cnt{font-size:11.5px;background:var(--sunken);border-radius:999px;padding:0 6px;color:var(--muted)}
.card{border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--panel)}
.connect{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--bg);margin-bottom:22px;flex-wrap:wrap}
.connect .cic{width:40px;height:40px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.urlbox{display:flex;align-items:center;gap:6px;height:36px;padding:0 4px 0 12px;border:1px solid var(--border-2);border-radius:9px;background:var(--panel);font-family:var(--mono);font-size:13px;flex:1;min-width:220px}
.urlbox span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clients{display:flex;gap:6px}
.stat-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat-dot.on{background:var(--ok)}.stat-dot.off{background:var(--danger)}
.danger-zone{border:1px solid color-mix(in srgb,var(--danger) 35%,var(--border));border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-top:20px}

/* screens */
.screen{height:100%;display:grid;place-items:center;padding:24px 16px;overflow:auto;background:radial-gradient(1200px 600px at 50% -10%,var(--accent-soft),transparent 60%),var(--bg)}
.login{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.login .logo{width:52px;height:52px;border-radius:14px}
.login h1{margin:0;font-size:24px;letter-spacing:-.02em;font-weight:650}
.login .sub{color:var(--muted);margin-top:4px}
.ms{height:44px;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:10px;border:1px solid var(--border-2);background:var(--panel);font-weight:600;font-size:14px;box-shadow:var(--shadow);transition:transform .1s,box-shadow .12s}
.ms:hover{box-shadow:var(--shadow-lg)}
.ms:active{transform:translateY(1px)}
.consent{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);padding:26px 22px 18px}
.c-top{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px;color:var(--faint)}
.c-top .ap{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:18px}
.consent h1{font-size:18px;text-align:center;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
.consent .who{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;margin:16px 0 10px}
.consent .redir{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:var(--faint);margin:12px 0 2px}

/* tooltip, toast */
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);font-size:12px;font-weight:500;padding:5px 8px;border-radius:7px;opacity:0;transform:translateY(2px);transition:opacity .1s,transform .1s;white-space:nowrap;display:flex;gap:8px;align-items:center;max-width:320px}
#tip.on{opacity:1;transform:none}
#tip kbd{background:transparent;color:inherit;opacity:.7;border-color:currentColor;border-bottom-width:1px}
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:9px 10px 9px 14px;border-radius:12px;background:var(--fg);color:var(--panel);box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;opacity:0;transform:translateY(8px) scale(.98);transition:opacity .2s,transform .2s;max-width:100%}
.toast.in{opacity:1;transform:none}
.toast .tsub{opacity:.65;font-weight:400}
.toast .tw2{color:var(--warn-dot)}
.tbtn{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:7px;background:color-mix(in srgb,var(--panel) 16%,transparent);color:var(--panel);font-weight:600;font-size:12.5px}
.tbtn:hover{background:color-mix(in srgb,var(--panel) 26%,transparent)}
.toast.bad{background:var(--danger);color:#fff}

/* areas */
.a-rules{--ac:var(--c-rules)}.a-skills{--ac:var(--c-skills)}.a-docs{--ac:var(--c-docs)}
.ac-rules,.ac-rules .i{color:var(--c-rules)!important}.ac-skills,.ac-skills .i{color:var(--c-skills)!important}.ac-docs,.ac-docs .i{color:var(--c-docs)!important}
.ac-rules,.ac-skills,.ac-docs{display:inline-flex}
.row.area .ri{color:var(--ac)}
.row.area .nm{font-weight:600;color:var(--fg)}
.row.skill .ri{color:var(--c-skills)}
.tile[class*="a-"] .fic,.fhead[class*="a-"] .fic{background:color-mix(in srgb,var(--ac) 13%,transparent);color:var(--ac)}
.tile[class*="a-"]:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--border))}
.tile .num{font-variant-numeric:tabular-nums;color:var(--fg-2);font-weight:600}
.fhead .grow{flex:1}
/* wiki links */
.wl{display:inline-flex;align-items:center;gap:3px;padding:0 6px;border-radius:6px;font-size:.9em;line-height:1.55;vertical-align:baseline;background:color-mix(in srgb,var(--ac,var(--accent)) 11%,transparent);color:var(--ac,var(--accent));cursor:pointer;white-space:nowrap;font-weight:500;transition:background .12s}
.md a.wl{border:0;color:var(--ac,var(--accent))}
.md a.wl.a-docs,.md a.wl.a-skills,.md a.wl.a-rules,.md a.wl.warn{color:var(--ac)}
.wl:hover{background:color-mix(in srgb,var(--ac,var(--accent)) 20%,transparent)}
.wl .i{opacity:.85}
.wl.warn{--ac:var(--warn);background:var(--warn-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 35%,transparent)}
.wl.broken{--ac:var(--danger);background:var(--danger-soft);cursor:default;text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--danger) 50%,transparent)}
.wl.locked{--ac:var(--faint);background:var(--sunken);cursor:default;padding:0 5px}
.editable .wl{cursor:default}
/* skill header */
.skhead{border:1px solid var(--border);border-radius:14px;background:var(--bg);margin:4px 0 20px;overflow:hidden}
.skt{display:flex;gap:12px;align-items:flex-start;padding:12px 12px 10px 14px}
.skic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c-skills) 13%,transparent);color:var(--c-skills)}
.skt code{font-size:13px;color:var(--fg);font-weight:500}
.skt p{margin:2px 0 0;color:var(--muted);font-size:13.5px;line-height:1.5}
.skp{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding:1px 4px;border-radius:5px}.skp:hover{background:var(--hover);color:var(--fg)}
.sfiles{display:flex;gap:4px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--border);background:var(--panel)}
.sf{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:8px;font-size:12.5px;font-family:var(--mono);color:var(--muted);position:relative;white-space:nowrap;flex:none}
.sf:hover{background:var(--hover);color:var(--fg)}
.sf.on{background:var(--sunken);color:var(--fg);box-shadow:inset 0 0 0 1px var(--border-2)}
.sf.sub{color:var(--c-skills)}
.sfd{width:6px;height:6px;border-radius:50%;background:var(--warn-dot)}.sfd.dr{background:var(--accent)}
/* code */
.code{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg)}
.code-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12.5px;color:var(--muted);background:var(--panel)}
.code-h.solo{border:1px solid var(--border);border-radius:10px;margin-bottom:12px}
.code pre{margin:0;padding:12px 0;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.65;color:var(--fg)}
.code .ln{display:inline-block;width:44px;padding-right:14px;text-align:right;color:var(--faint);user-select:none}
.raw.codeed{white-space:pre;tab-size:2}
/* rules meter */
.meter{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;margin:-4px 0 18px;background:var(--bg)}
.meter .mic{color:var(--c-rules);display:flex}
.mbar{flex:1;height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.mbar span{display:block;height:100%;border-radius:99px;background:var(--c-rules)}
.meter.warn .mbar span{background:var(--warn-dot)}.meter.bad .mbar span{background:var(--danger)}
.mnum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-family:var(--mono)}
/* editor link notes */
.lnotes{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 14px}
.ln-i{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;font-size:12px}
.ln-i code{font-size:12px}
.ln-i.warn{background:var(--warn-soft);color:var(--warn)}.ln-i.broken{background:var(--danger-soft);color:var(--danger)}

# Writing a skill

## Frontmatter
- `name`: lowercase letters, digits and hyphens. Max 64 characters.
- `description`: one line that says when to use the skill. Max 1024 characters.

## Body
- Write instructions, not prose. Start each step with a verb.
- Keep the body under 150 lines. Move detail into files next to `SKILL.md`.
- Link documentation with canonical paths, one level deep.
- Follow [[documentation/handbook/writing-style]].

## Never
- Put secrets, tokens or customer data in a skill.
- Link a skill to rules or to another skill.

<script type="text/markdown" data-seed="hub-promote">
---
name: hub-promote
description: Use when a draft is ready to go live. Walks through review, commit and publish.
---
# Promoting a skill

1. Call `list_versions` and note the published version.
2. Call `diff_versions` from published to head. Show the diff to the human.
3. Check the frontmatter: `name` and `description` are present and accurate.
4. Call `commit_version` with a message that says what changed and why.
5. Call `publish_skill`. Every changed file in the skill goes live together.
6. Verify with `get_skill` and report the published version.

## Rules
- Never publish without showing the diff, unless the human says so explicitly.
- Never publish a document you have not read in full.
- One skill per publish.
- Always report the version number you published.
</script>

<script type="text/markdown" data-seed="smoke-test.sh">
#!/usr/bin/env bash
# Smoke test a deployed service. Usage: smoke-test.sh <base-url>
set -euo pipefail

BASE="${1:?base url required}"

for attempt in 1 2 3; do
  if curl -fsS "$BASE/healthz" > /dev/null; then
    break
  fi
  echo "health check failed, attempt $attempt" >&2
  sleep 5
done

curl -fsS "$BASE/healthz" | grep -q '"ok":true'
curl -fsS -o /dev/null -w '%{http_code}' "$BASE/api/v1/version" | grep -q 200
echo "smoke test passed for $BASE"
</script>

|---|---|---|

#!/usr/bin/env bash
# Collect the last 30 minutes of logs for a service into a tarball.

OUT="logs-${SERVICE}-$(date +%Y%m%d-%H%M).tar.gz"

<script type="text/markdown" data-seed="rotate.py">
"""Rotate a secret in the vault and print the consumers to redeploy."""
import sys
import vault  # internal client

def main(name: str) -> None:
    current = vault.read_metadata(name)
    new_version = vault.rotate(name)
    print(f"rotated {name}: v{current.version} -> v{new_version}")
    for consumer in current.consumers:
        print(f"redeploy: {consumer}")

if __name__ == "__main__":
    main(sys.argv[1])
</script>
<script type="text/markdown" data-seed="sql-review">
---
name: sql-review
description: Use when reviewing SQL for analytics or migrations. Checks correctness, cost and safety.
---
# SQL review

## Correctness
- Every join states its keys. No implicit cross joins.
- `NULL` handling is explicit in filters and aggregates.
- Window functions declare `PARTITION BY` and `ORDER BY`.

## Cost
- Filter on partition columns first.
- Avoid `SELECT *` outside exploration.
- Check the query plan for full scans on tables over 10 GB with [[skills/sql-review/scripts/explain-check.sql]].

## Safety
- Migrations are additive. Drop columns in a later release.
- `UPDATE` and `DELETE` run inside a transaction with a row count check.

See [[documentation/data/dbt-conventions]] for model naming and [[documentation/data/warehouse]] for table sizes.
</script>
<script type="text/markdown" data-seed="explain-check.sql">
-- Flag full scans on large tables in the last query plan.
SELECT
  table_name,
  bytes_scanned / 1e9 AS gb_scanned,
  partition_filter_used
FROM query_plan_stats
WHERE query_id = :query_id
  AND bytes_scanned > 10e9
  AND NOT partition_filter_used
ORDER BY bytes_scanned DESC;
</script>

function lineDiff(a,b){const A=a.split('\n'),B=b.split('\n'),n=A.length,m=B.length;const dp=Array.from({length:n+1},()=>new Int32Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);const ops=[];let i=0,j=0;while(i<n&&j<m){if(A[i]===B[j]){ops.push({t:' ',a:i+1,b:j+1,s:A[i]});i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){ops.push({t:'-',a:i+1,s:A[i]});i++}else{ops.push({t:'+',b:j+1,s:B[j]});j++}}while(i<n){ops.push({t:'-',a:i+1,s:A[i]});i++}while(j<m){ops.push({t:'+',b:j+1,s:B[j]});j++}return ops}

 ops.forEach((o,i)=>{if(o.t===' '&&!keep.has(i)){gap++;return}flush();h+=`<tr class="${o.t==='+'?'a':o.t==='-'?'d':''}"><td class="n">${o.a||''}</td><td class="n">${o.b||''}</td><td class="c"><span class="sg">${o.t===' '?'':o.t}</span>${esc(o.s)||' '}</td></tr>`});flush();

function searchResHtml(){const r=searchAll(S.q);const items=[...r.skills.map(s=>({id:s.d.id,html:`<span class="sk ac-${s.area}">${ic(s.sm?'sparkles':AREAS[s.area].icon,15)}</span><div class="grow"><div class="st">${hl(s.fm.name,r.toks)}</div>${s.fm.description?`<div class="sd">${hl(s.fm.description,r.toks)}</div>`:''}${snippet(s.body,r.toks)?`<div class="sp">${hl(snippet(s.body,r.toks),r.toks)}</div>`:''}</div><span class="faint" style="font-size:11.5px;white-space:nowrap">${esc(visPathStr(s.sm?N(s.d.parent).parent:s.d.parent))}</span>`})),...r.names.map(n=>({id:navId(n),html:`<span class="ac-${areaOf(n.id)}">${ic(nodeIcon(n),15)}</span><div class="grow"><div style="font-size:13px">${hl(n.name,r.toks)}</div></div><span class="faint" style="font-size:11.5px">${esc(visPathStr(n.parent))}</span>`}))];
 S._sItems=items.map(i=>i.id);if(!items.length)return `<div class="sres"><div class="empty" style="padding:24px 0">${ic('search',18)}<span>No matches</span></div></div>`;
 return `<div class="sres" role="listbox">${items.map((it,i)=>`<button class="sr ${i===S.sIdx?'on':''}" data-a="go-node" data-id="${it.id}" role="option">${it.html}</button>`).join('')}</div>`}

 return `<div class="meter ${st}" data-tip="Published rules sent to every agent on connect"><span class="mic">${ic('bot',15)}</span><div class="mbar"><span style="width:${pct.toFixed(1)}%"></span></div><span class="mnum">${(b/1024).toFixed(1)} / ${RULES_CAP/1024} KB</span></div>`}

 if(a==='rules')return f.id==='A_rules'?b('new-doc','file-plus','New rule','Rule'):'';
 if(a==='skills'){const inSkill=skillOf(f.id);return inSkill?b('new-doc','file-plus','New file','File')+b('new-folder','folder-plus','New folder','Folder')+b('new-skill','sparkles','New sub-skill','Sub-skill'):b('new-skill','sparkles','New skill','Skill')+b('new-folder','folder-plus','New folder','Folder')}
 return b('new-doc','file-plus','New document','Document')+b('new-folder','folder-plus','New folder','Folder')}
function itemHtml(n){if(n.kind==='folder'){if(isSkill(n)){const m=skillMdOf(n);const{fm}=splitFM(docMetaContent(m));const rv=role(n.id);const v=rv>=2?head(m):m.published;return `<div class="item" data-a="go-node" data-id="${n.id}"><span class="ac-skills">${ic('sparkles',17)}</span><div style="min-width:0"><div class="t ell">${esc(n.name)}</div>${fm&&fm.description?`<div class="d">${esc(fm.description)}</div>`:''}</div>${skillMark(n)||'<span></span>'}<span class="v">${v?'v'+v:''}</span><span class="w">${skillFiles(n,true).length}</span><span class="faint">${ic('file',14)}</span></div>`}

 const rv=role(n.id);const last=rv>=2?(n.draft?n.draft.ts:head(n)?n.versions[head(n)-1].ts:n.created):n.versions[n.published-1].ts;const by=rv>=2?(n.draft?n.draft.by:head(n)?n.versions[head(n)-1].by:n.by):n.versions[n.published-1].by;const lc=extractLinks(docMetaContent(n)).length;

function folderHtml(f){const r=role(f.id);const items=kids(f.id);const ar=isArea(f);const k=areaOf(f.id);
 return `<div class="page"><div class="dh"><nav class="crumbs">${crumbs(f.id)}</nav><div class="acts">
 ${newBtns(f)}${r>=4?ib('share','user-plus','Share'):''}${ib('drawer','panel-right','Details','class="hide-m"')}${r>=4&&!ar?ib('menu','more','More',`data-m="more" data-id="${f.id}"`):''}</div></div>
 <div class="fhead ${ar?'a-'+k:''}"><span class="fic">${ic(ar?AREAS[k].icon:'folder',20)}</span><h1>${esc(f.name)}</h1>${ar?`<span class="chip" data-tip="${esc(AREAS[k].tip)}">${ic(k==='rules'?'bot':k==='skills'?'search':'link',12)}${k==='rules'?'Always on':k==='skills'?'On demand':'Linked'}</span>`:''}${!f.inherit?`<span class="chip warn" data-tip="Access is set here only">${ic('link-off',12)}Isolated</span>`:''}</div>

function docHtml(d){const r=role(d.id);if(S.editing&&S.edit&&S.edit.id===d.id)return editorHtml(d);const v=currentView(d);const sk=skillOf(d.id);curSrc=d.id;

 let body,banner='';

 else{const{fm,body:b}=isCode(d)?{fm:null,body:vContent(d,v)}:splitFM(vContent(d,v));
  if(v==='draft')banner=`<div class="banner draft">${ic('pencil',15)}<div class="grow"><b>Draft</b>${av(d.draft.by,18)}<span class="muted">${ago(d.draft.ts)}</span></div><button class="btn sm" data-a="edit">${ic('pencil',13)}<span>Continue</span></button><button class="btn sm" data-a="diff-open" data-v="draft">${ic('diff',13)}</button><button class="btn sm ghost danger" data-a="discard" data-confirm aria-label="Discard draft" data-tip="Discard draft">${ic('trash',13)}</button></div>`;

 return `<div class="page"><div class="dh"><nav class="crumbs">${crumbs(d.id)}</nav><div class="acts">${acts}</div></div>${sk?skillHead(sk,d):""}${banner}${body}</div>`}

function readersOf(id){return DB.users.filter(u=>u.status==='active').map(u=>canReadAs(u.id,id)?1:0).join('')}
function moveNode(id,dest){const n=N(id),prev=n.parent;if(DB.nodes.some(x=>x.parent===dest&&x.id!==id&&alive(x.id)&&x.name.toLowerCase()===n.name.toLowerCase())){toast('Name already used there',{icon:'alert',kind:'bad'});return}const before=readersOf(id);n.parent=dest;const after=readersOf(id);const changed=[...before].filter((c,i)=>c!==after[i]).length;S.open.add(dest);log('move_node',id);
 toast('Moved to '+N(dest).name,{icon:changed?'alert':'move',warn:!!changed,sub:changed?`access changed for ${changed}`:'',undo:()=>{n.parent=prev;log('move_node',id)}});render()}
function delNode(id){const n=N(id);n.deleted=Date.now();n.deletedBy=S.me;log('delete_node',id);if(isDesc(S.sel,id))S.sel=n.parent;toast('Deleted '+n.name,{icon:'trash',undo:()=>{n.deleted=null;log('restore_node',id)}});render()}
function newDoc(fid){const id=nid('d');const name=uniqueName(fid,'untitled');DB.nodes.push({id,parent:fid,kind:'doc',name,versions:[],published:null,draft:null,by:S.me,created:Date.now()});log('create_doc',id);S.open.add(fid);S.sel=id;S.view='files';S.menu=null;S.modal=null;startEdit();S.renaming=id;if(narrow())S.mTree=true;S.focusNext='#rn';render()}
function newSkill(pid){const fid=nid('s');const nm=uniqueName(pid,'new-skill');DB.nodes.push({id:fid,parent:pid,kind:'folder',name:nm,inherit:1,by:S.me,created:Date.now()});const id=nid('d');DB.nodes.push({id,parent:fid,kind:'doc',name:'SKILL.md',versions:[],published:null,draft:{content:'---\nname: '+nm+'\ndescription: \n---\n# '+nm+'\n\n1. \n',base:0,by:S.me,ts:Date.now(),etag:nid('e')},by:S.me,created:Date.now()});log('create_folder',fid);log('create_doc',id);S.open.add(pid);S.open.add(fid);S.sel=id;S.view='files';S.menu=null;S.modal=null;startEdit();S.focusNext='#ed-name';render();const e=$('#ed-name');if(e)e.select()}
function newFolder(pid){const id=nid('f');DB.nodes.push({id,parent:pid||null,kind:'folder',name:uniqueName(pid||null,'New folder'),inherit:1,by:S.me,created:Date.now()});log('create_folder',id);if(pid)S.open.add(pid);S.renaming=id;S.menu=null;S.focusNext='#rn';render()}
function commitRename(){const id=S.renaming;if(!id)return;const el=$('#rn');S.renaming=null;const n=N(id);const v=el?el.value.trim():n.name;if(v&&v!==n.name){if(v.includes('/')||v.length>120)toast('No slashes, max 120 characters',{icon:'alert',kind:'bad'});else if(DB.nodes.some(x=>x.parent===n.parent&&x.id!==id&&alive(x.id)&&x.name.toLowerCase()===v.toLowerCase()))toast('Name already used here',{icon:'alert',kind:'bad'});else{n.name=v;log('rename_node',id)}}render()}
/* editor */
function startEdit(){const d=N(S.sel);if(!d||role(d.id)<2)return;const src=latestContent(d);if(!isSkillMd(d)){S.edit={id:d.id,name:'',desc:'',rest:'',body:src,raw:isCode(d),save:'saved',dirty:false,logged:false}}else{const{fm,body,rest}=splitFM(src);S.edit={id:d.id,name:fm?.name||'',desc:fm?.description||'',rest,body,raw:false,save:'saved',dirty:false,logged:false}}S.editing=true;S.viewing='draft';S.menu=null}
const editContent=(d,E)=>isSkillMd(d)?buildFM(E.name,E.desc,E.rest)+E.body:E.body;
function syncEditor(){if(!S.edit)return;const b=$('#ed-body');if(b&&S.edit.dirty){S.edit.body=htmlToMd(b);S.edit.dirty=false}const r=$('#ed-raw');if(r)S.edit.body=r.value}
let saveT=null;
function scheduleSave(){if(!S.edit)return;S.edit.save='pending';setSaveIcon();clearTimeout(saveT);saveT=setTimeout(flush,2000)}
function setSaveIcon(){const e=$('#save-ic');if(e){e.innerHTML=saveIcon();e.className='save '+(S.edit.save==='saved'?'ok':'');e.dataset.tip=S.edit.save==='saved'?'Saved to draft':'Saving'}}
function flush(){clearTimeout(saveT);if(!S.editing||!S.edit)return;syncEditor();const E=S.edit;const d=N(E.id);updateLinkNotes();const content=editContent(d,E);const base=latestContent(d);if(content===base){E.save='saved';setSaveIcon();return}
 E.save='saving';setSaveIcon();if(!d.draft)d.draft={base:head(d)};Object.assign(d.draft,{content,by:S.me,ts:Date.now(),etag:nid('e')});if(!E.logged){log('update_draft',d.id);E.logged=true}
 setTimeout(()=>{if(S.edit===E){E.save='saved';setSaveIcon()}const tb=$('#tree-body');if(tb){const st=tb.scrollTop;tb.innerHTML=treeRows(roots(),0);tb.scrollTop=st}},350)}
function leaveEdit(){flush();S.editing=false;const d=N(S.edit.id);S.viewing=d&&d.draft?'draft':null;S.edit=null}
function openCommit(){flush();const d=N(S.sel);if(!d.draft){toast('No changes to commit',{icon:'check'});return}const err=fmErr(d,S.edit||splitFMtoE(d.draft.content));if(err){toast(err,{icon:'alert',kind:'bad'});return}S.modal={type:'commit',msg:'',pub:false};S.focusNext='#commit-msg';render()}
function splitFMtoE(c){const{fm}=splitFM(c);return{name:fm?.name||'',desc:fm?.description||''}}
function doCommit(){const d=N(S.sel);const msg=($('#commit-msg')?.value||'').trim()||'Update';const pub=S.modal?.pub;if(!d.draft)return;const c=d.draft.content;const n=head(d)+1;d.versions.push({n,content:c,msg,by:S.me,ts:Date.now()});d.draft=null;const{fm}=splitFM(c);if(isSkillMd(d)&&fm&&fm.name){const f=N(d.parent);if(/^new-skill(-\d+)?$/.test(f.name))f.name=uniqueName(f.parent,fm.name,f.id)}log('commit_version',d.id,n);S.editing=false;S.edit=null;S.modal=null;S.viewing=null;
 const sk=skillOf(d.id);if(pub&&sk){publishSkill(sk)}else if(pub){const prev=d.published;d.published=n;log('publish_version',d.id,n);toast('Published v'+n,{icon:'rocket',undo:()=>{d.published=prev;log('publish_version',d.id,prev)}})}else toast('Committed v'+n,{icon:'commit'});render()}
/* a skill goes live as a whole: every changed file at its latest version */
function publishSkill(sk){const files=pendingFiles(sk);if(!files.length){toast('Up to date',{icon:'check'});return}const prev=files.map(f=>[f,f.published]);for(const f of files){f.published=head(f);log('publish_version',f.id,f.published)}toast('Published '+sk.name,{icon:'rocket',sub:files.length+(files.length===1?' file':' files'),undo:()=>{for(const[f,p]of prev)f.published=p}})}
function insertImage(file){if(!file)return;if(file.type==='image/svg+xml'){toast('SVG is not allowed',{icon:'alert',kind:'bad'});return}if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)){toast('PNG, JPEG, WebP or GIF',{icon:'alert',kind:'bad'});return}if(file.size>5*1024*1024){toast('Max 5 MB',{icon:'alert',kind:'bad'});return}
 const rd=new FileReader();rd.onload=()=>{const id=nid('a');DB.assets[id]={data:rd.result,name:file.name};const alt=file.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ');const md=`![${alt}](asset://${id})`;
  if(S.edit.raw){const r=$('#ed-raw');const p=r.selectionStart??r.value.length;r.value=r.value.slice(0,p)+'\n'+md+'\n'+r.value.slice(p);S.edit.body=r.value}else{const b=$('#ed-body');b.focus();if(!document.execCommand('insertHTML',false,imgHtml(alt,'asset://'+id,true)+'<p><br></p>'))b.insertAdjacentHTML('beforeend',imgHtml(alt,'asset://'+id,true));S.edit.dirty=true}
  scheduleSave();toast('Image added',{icon:'image'})};rd.readAsDataURL(file)}
function fmtCmd(c){const b=$('#ed-body');if(!b)return;b.focus();const m={h2:['formatBlock','h2'],bold:['bold'],italic:['italic'],ul:['insertUnorderedList'],ol:['insertOrderedList'],quote:['formatBlock','blockquote'],code:['formatBlock','pre']}[c];if(m)document.execCommand(m[0],false,m[1]||null);S.edit.dirty=true;scheduleSave()}
function arm(el){el.classList.add('armed');const orig=el.innerHTML;el.innerHTML=ic('check',14)+'<span>Sure?</span>';setTimeout(()=>{if(document.body.contains(el)){el.classList.remove('armed');el.innerHTML=orig}},3000)}

function act(a,ds,e,el,prevMenu){const d=N(S.sel);
 switch(a){
 case 'sel':{const n=N(ds.id);if(S.renaming===ds.id)return;if(n.kind==='folder'&&(S.sel===ds.id||(isSkill(n)&&S.sel===skillMdOf(n).id))&&S.view==='files'){S.open.has(n.id)?S.open.delete(n.id):S.open.add(n.id);render();return}if(n.kind==='folder')S.open.add(n.id);goNode(ds.id);return}

 case 'menu':{if(prevMenu&&prevMenu.type===ds.m&&prevMenu.id===(ds.id||S.sel)){S.menu=null}else openMenu(ds.m,el,ds.id||S.sel);render();return}
 case 'ctx-btn':{if(prevMenu&&prevMenu.type==='ctx'&&prevMenu.id===ds.id){S.menu=null}else openMenu('ctx',el,ds.id);render();return}
 case 'scrim':S.mTree=false;if(narrow())S.drawer=null;render();return;
 case 'm-tree':S.mTree=!S.mTree;render();return;
 case 'drawer':S.drawer=S.drawer?null:(N(S.sel).kind==='doc'?'links':'access');render();return;
 case 'drawer-close':S.drawer=null;render();return;
 case 'dtab':S.drawer=ds.v;render();return;
 case 'view':{S.viewing=ds.v==='draft'?'draft':+ds.v;S.menu=null;if(S.editing)leaveEdit();if(narrow())S.drawer=null;render();return}

 case 'edit-close':leaveEdit();render();return;

 case 'fmt':return fmtCmd(ds.cmd);
 case 'img':$('#file').click();return;
 case 'discard':{const dd=N(S.sel);const prev=dd.draft;dd.draft=null;S.editing=false;S.edit=null;S.viewing=null;log('discard_draft',dd.id);toast('Draft discarded',{icon:'trash',undo:()=>{dd.draft=prev}});render();return}
 case 'commit-open':S.modal=null;return openCommit();
 case 'commit':return doCommit();
 case 'publish-open':{if(S.editing)leaveEdit();const v=ds.v?+ds.v:head(d);S.modal={type:'publish',v};S.menu=null;render();return}
 case 'pub-v':S.modal.v=+ds.v;render();return;
 case 'publish':{const v=S.modal.v;const prev=d.published;d.published=v;log('publish_version',d.id,v);S.modal=null;S.viewing=null;toast((v<(prev||0)?'Rolled back to v':'Published v')+v,{icon:'rocket',undo:()=>{d.published=prev;log('publish_version',d.id,prev)}});render();return}
 case 'unpublish':{const dd=N(ds.id||S.sel);const prev=dd.published;dd.published=null;log('unpublish',dd.id,prev);S.modal=null;S.menu=null;toast('Unpublished',{icon:'eye-off',undo:()=>{dd.published=prev}});render();return}
 case 'diff-open':{if(S.editing)leaveEdit();const dd=N(S.sel);const b=ds.v==='draft'?'draft':+ds.v;const a=b==='draft'?(head(dd)||0):(b>1?b-1:0);S.modal={type:'diff',a,b};S.menu=null;render();return}
 case 'share':{const n=N(ds.id||S.sel);const f=n.kind==='doc'?n.parent:n.id;S.modal={type:'share',id:f,role:1,q:'',pick:null};S.menu=null;S.focusNext='#share-q';render();return}
 case 'pick':S.modal.pick={type:ds.t,id:ds.id};S.modal.q='';render();return;
 case 'unpick':S.modal.pick=null;S.focusNext='#share-q';render();return;
 case 'grant':{const M=S.modal;const ex=DB.grants.find(g=>g.node===M.id&&g.type===M.pick.type&&g.pid===M.pick.id);if(ex)ex.role=M.role||1;else DB.grants.push({id:nid('g'),node:M.id,type:M.pick.type,pid:M.pick.id,role:M.role||1,by:S.me,ts:Date.now()});log('grant_access',M.id);toast('Shared with '+pname(M.pick.type,M.pick.id),{icon:'user-plus'});M.pick=null;S.focusNext='#share-q';render();return}
 case 'check-pick':S.modal.check=ds.id;S.modal.cq=U(ds.id).name;render();return;
 case 'copy-link':S.menu=null;render();return copy('https://skills.acme.com/'+(N(ds.id||S.sel).kind==='doc'?'d/':'f/')+(ds.id||S.sel));
 case 'copy':return copy(ds.v==='__csv'?S.modal.csv:ds.v);
 case 'new-doc':{const f=ds.id||curFolder();if(f)newDoc(f);return}
 case 'new-folder':{const p=ds.id||curFolder();if(!p||areaOf(p)==='rules'){toast('Rules hold files only',{icon:'alert'});return}return newFolder(p)}
 case 'rename':{const n=N(ds.id);S.menu=null;S.open.add(n.parent);S.view='files';S.renaming=ds.id;S.focusNext='#rn';if(narrow())S.mTree=true;render();return}
 case 'delete':S.menu=null;return delNode(ds.id);
 case 'restore':{const n=N(ds.id);n.deleted=null;log('restore_node',n.id);toast('Restored '+n.name,{icon:'undo'});render();return}
 case 'move-open':S.modal={type:'move',id:ds.id,dest:null};S.menu=null;render();return;
 case 'move-pick':S.modal.dest=ds.id;render();return;
 case 'move':{const M=S.modal;S.modal=null;moveNode(M.id,M.dest);return}
 case 'export':S.modal={type:'export',id:ds.id};S.menu=null;log('export_tree',ds.id);render();return;
 case 'export-go':S.modal=null;toast('Export ready',{icon:'download',sub:'downloads are disabled in this preview'});render();return;
 case 'new-skill':{const p=ds.id||curFolder();if(p&&areaOf(p)==='skills'&&!isArea(N(p))||p==='A_skills')newSkill(p);return}
 case 'skill-publish-open':{if(S.editing)leaveEdit();S.modal={type:'skill-publish',id:ds.id,open:null};S.menu=null;render();return}
 case 'pf-open':S.modal.open=ds.id;render();return;
 case 'skill-publish':{const sk=N(ds.id);S.modal=null;publishSkill(sk);render();return}
 case 'copy-path':{S.menu=null;render();return copy('[['+canon(ds.id||S.sel)+']]')}
 case 'wl-insert':{const ta=$('#ed-raw');if(ta){ta.focus();document.execCommand('insertText',false,'[[');S.edit.body=ta.value}else{const b=$('#ed-body');b.focus();document.execCommand('insertText',false,'[[');S.edit.dirty=true}setTimeout(acCheck,0);return}
 case 'gf':{const k=ds.v;const on=AREA_KEYS.filter(a=>G.f[a]);if(G.f[k]&&on.length===1)return;G.f[k]=!G.f[k];G.alpha=Math.max(G.alpha,.35);render();return}
 case 'gz-in':return zoomAt(G.W/2,G.H/2,G.zoom*1.3);
 case 'gz-out':return zoomAt(G.W/2,G.H/2,G.zoom/1.3);

 case 'close-modal':S.modal=null;render();return;
 case 'palette':return openPalette();

 case 'theme':return toggleTheme();
 case 'logout':S.screen='login';S.menu=null;render();return;
 case 'login':S.screen='app';log('login');render();return;
 case 'act-as':{if(S.editing)leaveEdit();S.me=ds.id;S.menu=null;if(!isOwner()&&['people','teams','team','audit'].includes(S.view))S.view='files';if(!canRead(S.sel)){const first=DB.nodes.find(n=>n.kind==='doc'&&canRead(n.id));S.sel=first?first.id:null}S.viewing=null;toast('Acting as '+U(ds.id).name,{icon:'user'});render();return}
 case 'consent-preview':S.screen='consent';S.menu=null;S.consentScopes=new Set(['read','write']);render();return;
 case 'consent-deny':S.screen='app';render();return;
 case 'consent-allow':{const sc=[...S.consentScopes].filter(s=>MAX_SCOPES.includes(s));const ex=DB.conns.find(c=>c.client===S.consentClient);if(ex){ex.scopes=sc;ex.used=Date.now()}else DB.conns.unshift({id:nid('c'),client:S.consentClient,scopes:sc,created:Date.now(),used:Date.now()});S.screen='app';S.view='connections';toast(S.consentClient+' connected',{icon:'plug'});render();return}
 case 'revoke-conn':{const i=DB.conns.findIndex(c=>c.id===ds.id);const c=DB.conns[i];DB.conns.splice(i,1);log('revoke_mcp_connection',null);toast(c.client+' disconnected',{icon:'plug',undo:()=>DB.conns.splice(i,0,c)});render();return}
 case 'mint-open':S.modal={type:'mint',name:'',scopes:new Set(['read']),exp:'90'};S.focusNext='#mint-name';render();return;
 case 'mint':{const M=S.modal;const abc='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';let t='shk_';const a=new Uint32Array(40);crypto.getRandomValues(a);for(const x of a)t+=abc[x%abc.length];DB.tokens.unshift({id:nid('k'),name:M.name,scopes:SCOPES.map(s=>s[0]).filter(s=>M.scopes.has(s)),created:Date.now(),used:null,exp:M.exp==='0'?null:Date.now()+(+M.exp)*DAY});log('mint_api_token',null);S.modal={type:'reveal',name:M.name,token:t};render();return}
 case 'revoke-token':{const i=DB.tokens.findIndex(t=>t.id===ds.id);const t=DB.tokens[i];DB.tokens.splice(i,1);log('revoke_api_token',null);toast('Revoked '+t.name,{icon:'key'});render();return}
 case 'user-status':{const u=U(ds.id);u.status=u.status==='active'?'suspended':'active';log('set_user_status',null,null,{detail:u.name+' '+u.status});toast(u.name+(u.status==='active'?' reactivated':' suspended'),{icon:u.status==='active'?'check':'ban'});render();return}

 act(el.dataset.a,el.dataset,e,el,prevMenu)});

 if(id==='pal'){S.modal.q=t.value;S.modal.i=0;render();return}
 if(id==='ed-name'){S.edit.name=t.value.trim();$('#ed-err').textContent=fmErr(N(S.edit.id),S.edit);scheduleSave();return}
 if(id==='ed-desc'){S.edit.desc=t.value;$('#ed-err').textContent=fmErr(N(S.edit.id),S.edit);scheduleSave();return}
 if(id==='ed-raw'){S.edit.body=t.value;scheduleSave();acCheck();return}
 if(t.closest&&t.closest('#ed-body')){S.edit.dirty=true;scheduleSave();acCheck();return}
 if(id==='gq'){gFind(t.value);return}
 if(id==='share-q'){S.modal.q=t.value;render();return}
 if(id==='check-q'){S.modal.cq=t.value;S.modal.check=null;render();return}
 if(id==='people-q'){S.peopleQ=t.value;render();return}
 if(id==='teams-q'){S.teamsQ=t.value;render();return}
 if(id==='audit-q'){S.auditF.q=t.value;render();return}
 if(id==='add-member-q'){S.addQ=t.value;render();return}
 if(id==='newteam'){S.newTeamName=t.value;return}
 if(id==='mint-name'){S.modal.name=t.value.trim();const b=document.querySelector('[data-a="mint"]');if(b)b.disabled=!(S.modal.name&&S.modal.scopes.size);return}
 if(id==='commit-msg'){S.modal.msg=t.value}});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.ch;if(!c)return;const M=S.modal;
 switch(c){
 case 'diff-a':M.a=t.value==='draft'?'draft':+t.value;break;case 'diff-b':M.b=t.value==='draft'?'draft':+t.value;break;
 case 'share-role':M.role=+t.value;return;
 case 'grant-role':{const g=DB.grants.find(x=>x.id===t.dataset.gid);if(t.value==='remove'){const i=DB.grants.indexOf(g);DB.grants.splice(i,1);log('revoke_access',g.node);toast('Removed '+pname(g.type,g.pid),{icon:'user-minus',undo:()=>DB.grants.splice(i,0,g)})}else{g.role=+t.value;log('grant_access',g.node)}break}
 case 'inherit':{const f=N(M.id);f.inherit=t.checked?1:0;log('set_inherit',f.id);if(!t.checked)toast('Stopped inheriting from '+N(f.parent).name,{icon:'link-off',undo:()=>{f.inherit=1}});break}
 case 'commit-pub':M.pub=t.checked;return;
 case 'user-role':{const u=U(t.dataset.id);u.role=t.value;log('set_user_role',null,null,{detail:u.name+' '+u.role});toast(u.name+' is now '+(u.role==='owner'?'an owner':'a member'),{icon:'crown'});break}
 case 'sel-user':t.checked?S.selUsers.add(t.dataset.id):S.selUsers.delete(t.dataset.id);break;
 case 'sel-all':{const q=S.peopleQ.toLowerCase();const list=DB.users.filter(u=>u.id!==S.me&&(!q||(u.name+' '+u.email).toLowerCase().includes(q)));if(t.checked)list.forEach(u=>S.selUsers.add(u.id));else S.selUsers.clear();break}
 case 'member-role':{const m=T(S.teamId).members.find(x=>x.u===t.dataset.id);m.r=t.value;toast(U(m.u).name.split(' ')[0]+' is '+m.r,{icon:'check'});break}
 case 'audit-actor':S.auditF.actor=t.value;break;case 'audit-op':S.auditF.op=t.value;break;
 case 'mint-scope':t.checked?M.scopes.add(t.dataset.v):M.scopes.delete(t.dataset.v);break;
 case 'mint-exp':M.exp=t.value;return;
 case 'consent-scope':t.checked?S.consentScopes.add(t.dataset.v):S.consentScopes.delete(t.dataset.v);break;
 }render()});
document.addEventListener('focusin',e=>{if(e.target.id==='q'&&S.q.trim()&&!S.searchOpen){S.searchOpen=true;render()}});
document.addEventListener('keydown',e=>{const k=e.key,mod=e.metaKey||e.ctrlKey;const ae=document.activeElement;const typing=ae&&(/INPUT|TEXTAREA|SELECT/.test(ae.tagName)||ae.isContentEditable);
 if(S.screen!=='app')return;
 if(AC.open){if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();AC.i=Math.max(0,Math.min(AC.items.length-1,AC.i+(k==='ArrowDown'?1:-1)));acRender(null);return}if((k==='Enter'||k==='Tab')&&AC.items.length){e.preventDefault();acPick(AC.i);return}if(k==='Escape'){e.preventDefault();acClose();return}if(k==='ArrowLeft'||k==='ArrowRight')acClose()}
 if(ae&&ae.id==='gq'){if(k==='Enter'&&G.focus){e.preventDefault();goNode(G.focus.nav)}else if(k==='Escape'){ae.value='';gFind('');ae.blur()}return}
 if(mod&&k.toLowerCase()==='k'){e.preventDefault();openPalette();return}
 if(mod&&k.toLowerCase()==='s'){e.preventDefault();if(S.editing)openCommit();else if(N(S.sel)?.draft&&role(S.sel)>=2){S.modal=null;openCommit()}return}
 if(mod&&k==='Enter'&&S.modal?.type==='commit'){e.preventDefault();doCommit();return}
 if(k==='Escape'){if(S.renaming){S.renaming=null;render();return}if(S.modal){S.modal=null;render();return}if(S.menu){S.menu=null;render();return}if(S.searchOpen){S.searchOpen=false;ae.blur();render();return}if(S.editing){leaveEdit();render();return}if(S.mTree){S.mTree=false;render();return}return}
 if(ae&&ae.id==='rn'&&k==='Enter'){e.preventDefault();commitRename();return}
 if(S.modal?.type==='palette'){const M=S.modal;if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();M.i=Math.max(0,Math.min((M.items||[]).length-1,M.i+(k==='ArrowDown'?1:-1)));render();return}if(k==='Enter'&&M.items&&M.items[M.i]){e.preventDefault();const it=M.items[M.i];S.modal=null;it.go();render();return}}
 if(ae&&ae.id==='q'){const n=(S._sItems||[]).length;if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();S.sIdx=Math.max(0,Math.min(n-1,S.sIdx+(k==='ArrowDown'?1:-1)));render();return}if(k==='Enter'&&n){e.preventDefault();const id=S._sItems[S.sIdx];S.q='';ae.blur();goNode(id);return}}
 if(ae&&ae.id==='share-q'&&k==='Enter'){const b=document.querySelector('.sugg [data-a="pick"]');if(b){e.preventDefault();b.click()}return}
 if(ae&&ae.id==='newteam'&&k==='Enter'){act('create-team',{});return}
 if(typing)return;
 if(k==='/'){e.preventDefault();$('#q')?.focus();return}
 if(k==='e'&&!S.editing&&N(S.sel)?.kind==='doc'&&role(S.sel)>=2&&S.view==='files'){e.preventDefault();act('edit',{})}});
function openPalette(){S.menu=null;S.modal={type:'palette',q:'',i:0};S.focusNext='#pal';render()}
document.addEventListener('paste',e=>{if(!S.editing)return;const inBody=e.target.closest&&e.target.closest('#ed-body');const inRaw=e.target.id==='ed-raw';if(!inBody&&!inRaw)return;const f=[...(e.clipboardData?.files||[])][0];if(f){e.preventDefault();insertImage(f);return}if(inBody){e.preventDefault();const t=e.clipboardData.getData('text/plain');document.execCommand('insertText',false,t);S.edit.dirty=true;scheduleSave()}});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f&&S.editing)insertImage(f)});
/* drag and drop */
let hoverT=null;
document.addEventListener('dragstart',e=>{const r=e.target.closest&&e.target.closest('.row[draggable="true"]');if(!r)return;S.drag=r.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',S.drag);r.classList.add('dragging')});
function canDrop(id,dest){const n=N(id);return dest!==id&&!isDesc(dest,id)&&dest!==n.parent&&role(n.parent)>=4&&role(dest)>=4&&areaOf(dest)===areaOf(id)&&!(n.kind==='folder'&&areaOf(dest)==='rules')&&!(areaOf(id)==='skills'&&n.kind==='doc'&&!skillOf(dest))}
document.addEventListener('dragover',e=>{if(S.drag){const r=e.target.closest('.row[data-kind="folder"]');document.querySelectorAll('.row.drop').forEach(x=>x!==r&&x.classList.remove('drop'));if(r&&canDrop(S.drag,r.dataset.id)){e.preventDefault();e.dataTransfer.dropEffect='move';if(!r.classList.contains('drop')){r.classList.add('drop');clearTimeout(hoverT);hoverT=setTimeout(()=>{if(!S.open.has(r.dataset.id)){S.open.add(r.dataset.id);const tb=$('#tree-body');tb.innerHTML=treeRows(roots(),0)}},700)}}return}
 if(e.target.closest&&e.target.closest('#ed-body,#ed-raw')&&e.dataTransfer.types.includes('Files'))e.preventDefault()});
document.addEventListener('drop',e=>{if(S.drag){const r=e.target.closest('.row[data-kind="folder"]');const id=S.drag;S.drag=null;clearTimeout(hoverT);if(r&&canDrop(id,r.dataset.id)){e.preventDefault();moveNode(id,r.dataset.id)}else render();return}
 if(e.target.closest&&e.target.closest('#ed-body,#ed-raw')){const f=e.dataTransfer.files[0];if(f){e.preventDefault();insertImage(f)}}});
document.addEventListener('dragend',()=>{if(S.drag){S.drag=null;clearTimeout(hoverT);document.querySelectorAll('.dragging,.drop').forEach(x=>x.classList.remove('dragging','drop'))}});
/* tooltip */
let tipT=null,tipFor=null;const tip=$('#tip');
function hideTip(){clearTimeout(tipT);tipFor=null;tip.classList.remove('on')}
document.addEventListener('pointerover',e=>{const t=e.target.closest('[data-tip]');if(t===tipFor)return;hideTip();if(!t||e.pointerType==='touch'||t.classList.contains('armed'))return;tipFor=t;tipT=setTimeout(()=>{if(!document.body.contains(t))return;const[label,key]=t.dataset.tip.split('|');tip.innerHTML=esc(label)+(key?`<kbd>${esc(key)}</kbd>`:'');const r=t.getBoundingClientRect(),tr=tip.getBoundingClientRect();let x,y;if(t.closest('.rail')){x=r.right+8;y=r.top+r.height/2-tr.height/2}else{x=r.left+r.width/2-tr.width/2;y=r.bottom+6;if(y+tr.height>innerHeight-8)y=r.top-tr.height-6}x=Math.max(8,Math.min(innerWidth-tr.width-8,x));tip.style.left=x+'px';tip.style.top=y+'px';tip.classList.add('on')},350)});
['pointerdown','scroll','keydown'].forEach(ev=>document.addEventListener(ev,hideTip,true));
/* init */
(function(){const t=store.get('sh-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;render()})();
</script>
